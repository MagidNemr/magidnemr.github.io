<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magid Shop | المتجر الهندسي الفاخر للمعدات الكهربائية</title>
  <script src="https://minepi.com"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(20, 28, 46, 0.85);
      --border-glow: rgba(168, 85, 247, 0.3);
      --gold: #fbbf24;
      --gold-dark: #d97706;
      --purple: #7e22ce;
      --purple-light: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(251, 191, 36, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* الهيدر الفاخر */
    header {
      background: linear-gradient(180deg, rgba(30, 14, 54, 0.95) 0%, rgba(9, 13, 22, 0.98) 100%);
      border-bottom: 2px solid var(--gold-dark);
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .brand-tag {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold-dark);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 32px;
      background: linear-gradient(90deg, #fde68a, #f59e0b, #fde68a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    header p {
      color: #cbd5e1;
      font-size: 15px;
      max-width: 650px;
      margin: 0 auto 20px;
      line-height: 1.6;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
    }
    .btn-back:hover { background: rgba(255, 255, 255, 0.2); }

    .btn-auth {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5); }

    /* شريط البحث والتصفية */
    .controls-section {
      max-width: 1250px;
      margin: 25px auto 15px;
      padding: 0 20px;
    }

    .search-box {
      width: 100%;
      max-width: 550px;
      margin: 0 auto 20px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #131b2e;
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .search-box input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #131b2e;
      color: var(--text-muted);
      border: 1px solid #283548;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13.5px;
      transition: all 0.25s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: linear-gradient(135deg, var(--purple), #581c87);
      color: white;
      border-color: var(--purple-light);
      box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
    }

    /* شبكة المنتجات */
    .container {
      max-width: 1250px;
      margin: 20px auto 50px;
      padding: 0 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 3px solid var(--purple-light);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: var(--gold);
      box-shadow: 0 15px 35px rgba(126, 34, 206, 0.25);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: bold;
    }

    .badge-power { background: rgba(234, 88, 12, 0.2); color: #fdba74; border: 1px solid rgba(234, 88, 12, 0.4); }
    .badge-auto { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-home { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-tools { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4); }

    .sku-code {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .product-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .icon-box {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, rgba(126, 34, 206, 0.3), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .product-title {
      font-size: 17.5px;
      font-weight: bold;
      color: #fff;
      line-height: 1.4;
    }

    .product-desc {
      font-size: 13.5px;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 15px;
    }

    .specs-table {
      background: rgba(9, 13, 22, 0.75);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12.5px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-key { color: var(--text-muted); }
    .spec-val { color: var(--gold); font-weight: bold; }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .price-box {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .price-val {
      font-size: 21px;
      font-weight: 900;
      color: #e879f9;
    }

    .btn-buy {
      background: linear-gradient(135deg, #7e22ce, #9333ea);
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 14px;
      flex-grow: 1;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(126, 34, 206, 0.35);
    }
    .btn-buy:hover {
      background: linear-gradient(135deg, #9333ea, #a855f7);
      transform: scale(1.02);
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #060911;
      border-top: 1px solid #1e293b;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-tag">⚡ CERTIFIED INDUSTRIAL & HOME ELECTRICAL STORE ⚡</div>
    <h1>MAGID SHOP</h1>
    <p>وجهتك الهندسية الأولى لتوريد معدات القوى، لوحات التحكم الآلي، ومستلزمات التأسيس المنزلي المعتمدة بالدفع المباشر عبر شبكة Pi</p>
    <div class="nav-bar">
      <a href="index.html" class="btn btn-back">🔙 العودة لمنصة Smart Tech Aide</a>
      <button onclick="authWithPi()" class="btn btn-auth" id="user-status">🔐 تسجيل الدخول بحساب Pi</button>
    </div>
  </header>

  <div class="controls-section">
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="🔍 ابحث عن معدة (مثال: إنفرتر، قاطع 100 أمبير، سلك 3 مم، كونتاكتور...)">
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all', this)">📦 الكل (24 منتج)</button>
      <button class="filter-btn" onclick="filterProducts('power', this)">🏭 لوحات القوى والكنترول</button>
      <button class="filter-btn" onclick="filterProducts('automation', this)">⚙️ الأتمتة والمحركات</button>
      <button class="filter-btn" onclick="filterProducts('home', this)">🏠 كهرباء المنازل</button>
      <button class="filter-btn" onclick="filterProducts('tools', this)">🧰 أجهزة القياس والعدد</button>
    </div>
  </div>

  <div class="container">
    <div class="products-grid" id="productsGrid">

      <!-- ================= القسم الأول: لوحات القوى والكنترول الصناعي ================= -->
      
      <div class="product-card" data-cat="power">
        <div>
          <div class="card-top-row">
