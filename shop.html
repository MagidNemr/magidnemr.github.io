<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magid Shop | المتجر الهندسي الفاخر</title>
  <script src="https://minepi.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #070a12;
      background-image: 
        radial-gradient(circle at 20% 10%, rgba(126, 34, 206, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(245, 158, 11, 0.12) 0%, transparent 45%);
      color: #f8fafc;
      min-height: 100vh;
    }

    /* الهيدر الفاخر */
    header {
      background: linear-gradient(180deg, #1b0b33 0%, #070a12 100%);
      border-bottom: 2px solid #d97706;
      padding: 30px 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .brand-tag {
      display: inline-block;
      background: rgba(251, 191, 36, 0.12);
      color: #fbbf24;
      border: 1px solid #d97706;
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 34px;
      background: linear-gradient(90deg, #fde68a, #f59e0b, #fde68a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      margin-bottom: 8px;
    }
    header p {
      color: #cbd5e1;
      font-size: 14.5px;
      max-width: 650px;
      margin: 0 auto 20px;
      line-height: 1.6;
    }

    /* الأزرار الفخمة */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn-lux {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-back {
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      border: 1px solid #475569;
    }
    .btn-back:hover {
      background: #334155;
      border-color: #94a3b8;
    }
    .btn-auth {
      background: linear-gradient(135deg, #f59e0b, #b45309);
      color: #000;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }
    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.55);
    }

    /* شريط البحث مع زر بحث فخم */
    .controls {
      max-width: 1220px;
      margin: 25px auto 15px;
      padding: 0 15px;
    }
    .search-wrapper {
      max-width: 600px;
      margin: 0 auto 20px;
      display: flex;
      gap: 8px;
      background: #111827;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid #334155;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .search-wrapper input {
      flex-grow: 1;
      padding: 12px 16px;
      border: none;
      background: transparent;
      color: white;
      font-size: 14.5px;
      outline: none;
    }
    .btn-search {
      background: linear-gradient(135deg, #7e22ce, #a855f7);
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: 0.25s;
    }
    .btn-search:hover {
      background: linear-gradient(135deg, #9333ea, #c084fc);
    }

    /* أزرار الأقسام */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #111827;
      color: #94a3b8;
      border: 1px solid #283548;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13.5px;
      transition: all 0.25s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: linear-gradient(135deg, #7e22ce, #581c87);
      color: white;
      border-color: #c084fc;
      box-shadow: 0 4px 15px rgba(126, 34, 206, 0.45);
    }

    /* شبكة المنتجات */
    .container {
      max-width: 1220px;
      margin: 20px auto 50px;
      padding: 0 15px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px;
    }
    .product-card {
      background: linear-gradient(160deg, #161f33 0%, #0f1524 100%);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #283548;
      border-top: 3px solid #a855f7;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      border-color: #fbbf24;
      box-shadow: 0 14px 32px rgba(126, 34, 206, 0.3);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 11.5px;
    }
    .badge {
      padding: 4px 12px;
      border-radius: 14px;
      font-weight: bold;
      background: rgba(168, 85, 247, 0.18);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .sku {
      color: #94a3b8;
      font-family: monospace;
      background: #090d16;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .p-title {
      font-size: 17.5px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .p-desc {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 14px;
      line-height: 1.55;
    }
    .specs {
      background: #080b12;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 12.5px;
      border: 1px solid #1e293b;
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px dashed #1e293b;
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-k { color: #94a3b8; }
    .spec-v { color: #fbbf24; font-weight: bold; }

    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #1e293b;
      padding-top: 14px;
    }
    .price {
      font-size: 21px;
      font-weight: 900;
      color: #e879f9;
    }
    .btn-buy {
      background: linear-gradient(135deg, #7e22ce, #9333ea);
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      flex-grow: 1;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
      transition: 0.25s;
    }
    .btn-buy:hover {
      background: linear-gradient(135deg, #9333ea, #c084fc);
      transform: scale(1.02);
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #05070d;
      border-top: 1px solid #1e293b;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-tag">⚡ CERTIFIED INDUSTRIAL & HOME ELECTRICAL STORE ⚡</div>
    <h1>MAGID SHOP</h1>
    <p>متجر معدات القوى، لوحات التحكم الآلي، ومستلزمات التأسيس المنزلي بالدفع المباشر عبر شبكة Pi</p>
    <div class="nav-bar">
      <a href="index.html" class="btn-lux btn-back">🔙 العودة لمنصة Smart Tech Aide</a>
      <button onclick="authWithPi()" class="btn-lux btn-auth" id="user-status">🔐 تسجيل الدخول بحساب Pi</button>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrapper">
      <input type="text" id="searchInput" onkeyup="renderProducts()" placeholder="اكتب اسم القطعة أو الأمبير (مثال: إنفرتر، قاطع 250، سلك 4 مم...)">
      <button onclick="renderProducts()" class="btn-search">🔍 بحث</button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setCategory('all', this)" id="btn-all">📦 الكل</button>
      <button class="filter-btn" onclick="setCategory('power', this)">🏭 لوحات القوى</button>
      <button class="filter-btn" onclick="setCategory('auto', this)">⚙️ الأتمتة والمحركات</button>
      <button class="filter-btn" onclick="setCategory('home', this)">🏠 كهرباء المنازل</button>
      <button class="filter-btn" onclick="setCategory('tools', this)">🧰 أجهزة القياس</button>
    </div>
  </div>

  <div class="container">
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <footer id="storeFooter">
    ⚡ MAGID SHOP & SMART TECH AIDE | متجر محدث تلقائياً ومؤمّن بالكامل عبر شبكة Pi Network ⚡
  </footer>
