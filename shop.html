<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magid Shop | الموسوعة الهندسية الشاملة للمعدات الكهربائية</title>
<script src="https://minepi.com"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #070a12; color: #f8fafc; line-height: 1.6; }
  header { background: linear-gradient(180deg, #1b0b33 0%, #070a12 100%); border-bottom: 1px solid #2e1065; padding: 30px 20px; text-align: center; }

  header p { color: #cbd5e1; font-size: 14px; margin-bottom: 14px; }
  .stats-pill { display: inline-block; background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid #fbbf24; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 18px; }
  .nav-bar { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .btn-lux { padding: 11px 22px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; text-decoration: none; display: inline-block; }
  .btn-back { background: #1e293b; color: #fff; border: 1px solid #475569; }
  .btn-auth { background: linear-gradient(135deg, #f59e0b, #b45309); color: #000; border: none; }
  .controls { max-width: 1280px; margin: 20px auto; padding: 0 15px; }

  .search-dropdown { position: absolute; top: 106%; right: 0; left: 0; background: #111827; border-radius: 10px; z-index: 9999; display: none; max-height: 380px; overflow-y: auto; border: 1px solid #7e22ce; box-shadow: 0 14px 30px rgba(0,0,0,0.85); }
  .dropdown-header { padding: 10px 15px; background: #1e1b4b; color: #fbbf24; font-size: 13px; font-weight: bold; position: sticky; top: 0; border-bottom: 1px solid #4c1d95; display: flex; justify-content: space-between; align-items: center; }
  .btn-show-all-drop { background: #7e22ce; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
  .dropdown-item { padding: 11px 16px; border-bottom: 1px solid #1e293b; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
  .dropdown-item:hover { background: #2e1065; }
  .dropdown-info { display: flex; flex-direction: column; text-align: right; }
  .dropdown-title { color: #fff; font-weight: bold; font-size: 13.5px; }
  .dropdown-sub { color: #94a3b8; font-size: 11.5px; }
  .dropdown-price { color: #fbbf24; font-weight: bold; font-size: 14px; white-space: nowrap; margin-right: 12px; }
  .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .filter-btn { background: #111827; color: #94a3b8; border: 1px solid #283548; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: 0.3s; font-weight: 600; }
  .filter-btn.active { background: #7e22ce; color: white; border-color: #c084fc; }
  .container { max-width: 1280px; margin: 20px auto 50px; padding: 0 15px; }
  .result-info { margin-bottom: 15px; color: #94a3b8; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .product-card { background: #141c2e; border-radius: 14px; padding: 18px; border: 1px solid #1e293b; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
  .product-card:hover { transform: translateY(-4px); border-color: #7e22ce; box-shadow: 0 8px 20px rgba(126, 34, 206, 0.15); }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; }
  .badge { padding: 3px 10px; border-radius: 12px; font-weight: bold; background: rgba(126, 34, 206, 0.25); color: #d8b4fe; }
  .sku { color: #94a3b8; font-family: monospace; }
  .p-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 8px; }
  .p-desc { font-size: 12.5px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.5; flex-grow: 1; }
  .specs { background: #080b12; padding: 9px; border-radius: 8px; margin-bottom: 14px; font-size: 12px; }
  .spec-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1e293b; }
  .spec-row:last-child { border-bottom: none; }
  .spec-k { color: #94a3b8; }
  .spec-v { color: #fbbf24; font-weight: bold; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px solid #1e293b; }
  .price { font-size: 19px; font-weight: bold; color: #e879f9; }
  .btn-buy { background: linear-gradient(135deg, #7e22ce, #581c87); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.3s; }
  .btn-buy:hover { opacity: 0.9; transform: scale(1.03); }
</style>
</head>
<body>

<header>
  <h1>Magid Shop | الموسوعة الهندسية الشاملة للكهرباء</h1>
  <p>كتالوج ومتجر المعدات الكهربائية الصناعية والمنزلية والجهد المتوسط والطاقة الشمسية والمحركات</p>
  <div id="total-badge" class="stats-pill">جاري تحميل قاعدة البيانات الهندسية...</div>
  <div class="nav-bar">
    <a href="index.html" class="btn-lux btn-back">العودة للرئيسية</a>
    <button id="auth-btn" class="btn-lux btn-auth" onclick="loginWithPi()">تسجيل الدخول بمحفظة Pi</button>
  </div>
</header>

<div class="controls">
  <div class="search-wrapper">
    <input type="text" id="search-input" placeholder="اكتب اسم أي منتج (مثل: كونتاكتور، كابل، محرك، لوحة، محول)..." oninput="openSearchDropdown()" onfocus="openSearchDropdown()">
    <button class="btn-search" onclick="executeFullSearch()">بحث</button>
    <div id="search-dropdown" class="search-dropdown"></div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterProducts('all', this)">الكل</button>
    <button class="filter-btn" onclick="filterProducts('power', this)">الباور والكونتاكتورات</button>
    <button class="filter-btn" onclick="filterProducts('cables', this)">الكابلات والأسلاك</button>
    <button class="filter-btn" onclick="filterProducts('transformers', this)">المحولات والجهد المتوسط</button>
    <button class="filter-btn" onclick="filterProducts('auto', this)">الأوتوميشن و PLC</button>
    <button class="filter-btn" onclick="filterProducts('motors', this)">المحركات والمضخات</button>
    <button class="filter-btn" onclick="filterProducts('solar', this)">الطاقة الشمسية</button>
    <button class="filter-btn" onclick="filterProducts('panels', this)">اللوحات والتأريض والإنارة</button>
    <button class="filter-btn" onclick="filterProducts('home', this)">القواطع المنزلية</button>
    <button class="filter-btn" onclick="filterProducts('tools', this)">أجهزة القياس والعدد</button>
  </div>
</div>

<div class="container">
  <div class="result-info">
    <span id="showing-count">عرض جميع المعدات</span>
  </div>
  <div id="products-grid" class="products-grid"></div>
</div>

<script src="db-cables.js"></script>

<script>
  function getDB() {
    return window.storeDatabase || [];
  }

  function getMatches(q) {
    return getDB().filter(function(item) {
      return (item.t && item.t.toLowerCase().indexOf(q) !== -1) ||
             (item.s && item.s.toLowerCase().indexOf(q) !== -1) ||
             (item.b && item.b.toLowerCase().indexOf(q) !== -1) ||
             (item.d && item.d.toLowerCase().indexOf(q) !== -1) ||
             (item.v1 && item.v1.toLowerCase().indexOf(q) !== -1) ||
             (item.v2 && item.v2.toLowerCase().indexOf(q) !== -1);
    });
  }

  function renderProducts(list) {
    var grid = document.getElementById('products-grid');
    document.getElementById('showing-count').innerText = 'عدد النتائج المعروضة: ' + list.length + ' منتج ومقاس';
    grid.innerHTML = '';
    if (!list.length) {
      grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding:30px;">لا توجد معدات مطابقة لعبارة البحث.</p>';
      return;
    }
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML =
        '<div>' +
          '<div class="card-top">' +
            '<span class="badge">' + (item.b || '') + '</span>' +
            '<span class="sku">' + (item.s || '') + '</span>' +
          '</div>' +
          '<div class="p-title">' + item.t + '</div>' +
          '<div class="p-desc">' + item.d + '</div>' +
        '</div>' +
        '<div>' +
          '<div class="specs">' +
            '<div class="spec-row"><span class="spec-k">' + (item.k1 || '') + '</span><span class="spec-v">' + (item.v1 || '') + '</span></div>' +
            '<div class="spec-row"><span class="spec-k">' + (item.k2 || '') + '</span><span class="spec-v">' + (item.v2 || '') + '</span></div>' +
          '</div>' +
          '<div class="card-foot">' +
