<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magid Shop | المتجر الهندسي الفاخر</title>
  <script src="https://minepi.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #070a12; color: #f8fafc; }
    header { background: linear-gradient(180deg, #1b0b33 0%, #070a12 100%); border-bottom: 2px solid #d97706; padding: 25px 15px; text-align: center; }
    header h1 { font-size: 32px; color: #fbbf24; margin-bottom: 8px; }
    header p { color: #cbd5e1; font-size: 14px; margin-bottom: 18px; }
    .nav-bar { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn-lux { padding: 11px 22px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }
    .btn-back { background: #1e293b; color: #fff; border: 1px solid #475569; }
    .btn-auth { background: #f59e0b; color: #000; }
    .controls { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    .search-wrapper { max-width: 580px; margin: 0 auto 18px; display: flex; gap: 8px; background: #111827; padding: 6px; border-radius: 12px; border: 1px solid #334155; }
    .search-wrapper input { flex-grow: 1; padding: 10px 14px; border: none; background: transparent; color: white; font-size: 14px; outline: none; }
    .btn-search { background: #7e22ce; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .filter-btn { background: #111827; color: #94a3b8; border: 1px solid #283548; padding: 9px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .filter-btn.active { background: #7e22ce; color: white; border-color: #c084fc; }
    .container { max-width: 1200px; margin: 20px auto 40px; padding: 0 15px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .product-card { background: #141c2e; border-radius: 14px; padding: 18px; border: 1px solid #283548; border-top: 3px solid #a855f7; display: flex; flex-direction: column; justify-content: space-between; }
    .card-top { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 11px; }
    .badge { padding: 3px 10px; border-radius: 12px; font-weight: bold; background: rgba(168, 85, 247, 0.2); color: #e9d5ff; }
    .sku { color: #94a3b8; font-family: monospace; }
    .p-title { font-size: 17px; font-weight: bold; color: #fff; margin-bottom: 8px; }
    .p-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.5; }
    .specs { background: #080b12; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; }
    .spec-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #1e293b; }
    .spec-k { color: #94a3b8; }
    .spec-v { color: #fbbf24; font-weight: bold; }
    .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #1e293b; padding-top: 12px; }
    .price { font-size: 20px; font-weight: bold; color: #e879f9; }
    .btn-buy { background: #7e22ce; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; flex-grow: 1; }
    footer { text-align: center; padding: 20px; background: #05070d; border-top: 1px solid #1e293b; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ MAGID SHOP ⚡</h1>
    <p>متجر معدات القوى، لوحات التحكم الآلي، ومستلزمات التأسيس المنزلي بالدفع المباشر عبر شبكة Pi</p>
    <div class="nav-bar">
      <a href="index.html" class="btn-lux btn-back">🔙 العودة لمنصة Smart Tech Aide</a>
      <button onclick="authWithPi()" class="btn-lux btn-auth" id="user-status">🔐 تسجيل الدخول بحساب Pi</button>
    </div>
  </header>
  <div class="controls">
    <div class="search-wrapper">
      <input type="text" id="searchInput" onkeyup="render()" placeholder="ابحث عن معدة (مثال: إنفرتر، قاطع، سلك، كونتاكتور...)">
      <button onclick="render()" class="btn-search">🔍 بحث</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setCat('all', this)">📦 الكل (12)</button>
      <button class="filter-btn" onclick="setCat('power', this)">🏭 لوحات القوى</button>
      <button class="filter-btn" onclick="setCat('auto', this)">⚙️ الأتمتة والمحركات</button>
      <button class="filter-btn" onclick="setCat('home', this)">🏠 كهرباء المنازل</button>
      <button class="filter-btn" onclick="setCat('tools', this)">🧰 أجهزة القياس</button>
    </div>
  </div>
  <div class="container"><div class="products-grid" id="grid"></div></div>
  <footer>⚡ MAGID SHOP & SMART TECH AIDE | مؤمّن بالكامل عبر شبكة Pi Network ⚡</footer>
  <script>
    if (typeof Pi !== 'undefined') { Pi.init({ version: "2.0", sandbox: true, client_id: "6aCxa_MvLH9mgIA9y7EHBDszfOX8T" }); }
    var items = [
      { c: 'power', b: '🏭 لوحات القوى', s: 'MCCB-250A', t: 'قاطع رئيسي مقولب MCCB 250A', d: 'قاطع عمومي للوحات التوزيع الرئيسية بالمصانع.', k1: 'التيار:', v1: '250A (3P)', k2: 'سعة القطع:', v2: '50 kA', p: 28 },
      { c: 'power', b: '🏭 لوحات القوى', s: 'CONT-65A', t: 'كونتاكتور صناعي ثقيل 65 أمبير', d: 'لتشغيل المحركات الكبيرة والأحمال الحثية الشاقة.', k1: 'القدرة:', v1: '30 kW (40 HP)', k2: 'الملف:', v2: '220V/380V', p: 11 },
      { c: 'power', b: '🏭 لوحات القوى', s: 'PHASE-PRO', t: 'ريلاي حماية تتابع وانعكاس الفازات', d: 'شاشة رقمية لمراقبة فولت الفازات والحماية من الانعكاس.', k1: 'الشبكة:', v1: '380V (3P+N)', k2: 'الخرج:', v2: 'Relay 8A', p: 8 },
      { c: 'auto', b: '⚙️ الأتمتة', s: 'VFD-11KW', t: 'إنفرتر مغير سرعة VFD 11 كيلو وات', d: 'تحكم دقيق في سرعة وعزم المحركات مع واجهة ذكية.', k1: 'القدرة:', v1: '11 kW (15 HP)', k2: 'الاتصال:', v2: 'Modbus RS485', p: 65 },
      { c: 'auto', b: '⚙️ الأتمتة', s: 'PLC-24IO', t: 'وحدة تحكم منطقي مبرمج PLC 24 نقطة', d: 'وحدة PLC صناعية لأتمتة خطوط الإنتاج والماكينات.', k1: 'النقاط:', v1: '14 DI / 10 DO', k2: 'التغذية:', v2: '24V DC', p: 40 },
      { c: 'auto', b: '⚙️ الأتمتة', s: 'HMI-7INCH', t: 'شاشة تحكم صناعية لمس HMI 7 بوصة', d: 'شاشة ملونة لمراقبة وتشغيل الماكينات والربط مع PLC.', k1: 'المقاس:', v1: '7 بوصة TFT', k2: 'الحماية:', v2: 'IP65', p: 38 },
      { c: 'home', b: '🏠 المنازل', s: 'DB-24MOD', t: 'لوحة توزيع منزلية فاخرة 24 خط', d: 'لوحة دفن داخل الحائط بباب شفاف وبارات نحاس.', k1: 'السعة:', v1: '24 موديول', k2: 'الحماية:', v2: 'IP40', p: 10 },
      { c: 'home', b: '🏠 المنازل', s: 'RCCB-63A', t: 'قاطع الحماية من الصعق الكهربائي 63A', d: 'يفصل الكهرباء فوراً عند حدوث تسريب أرضي أو تلامس.', k1: 'الحساسية:', v1: '30 مللي أمبير', k2: 'التيار:', v2: '63 أمبير', p: 11 },
      { c: 'home', b: '🏠 المنازل', s: 'ATS-63A', t: 'مفتاح تحويل أوتوماتيك ATS 63A', d: 'تحويل تلقائي سريع بين شبكة الحكومة والمولد أو الطاقة الشمسية.', k1: 'التيار:', v1: '63 أمبير (2P)', k2: 'التحويل:', v2: '< 50ms', p: 14 },
      { c: 'home', b: '🏠 المنازل', s: 'WIRE-4MM', t: 'لفة سلك نحاس معزول 4 مم (100 متر)', d: 'سلك نحاس نقي لتغذية التكييفات والسخانات بأمان.', k1: 'المقطع:', v1: '4 مم² / 100م', k2: 'التحمل:', v2: '32 أمبير', p: 19 },
      { c: 'tools', b: '🧰 القياس', s: 'CLAMP-600A', t: 'بنسة أمبير احترافية True-RMS 600A', d: 'قياس التيار المتردد والمستمر والجهد والتردد بدقة.', k1: 'التيار:', v1: '600A AC/DC', k2: 'الميزة:', v2: 'True-RMS', p: 13 },
      { c: 'tools', b: '🧰 القياس', s: 'MEGGER-1KV', t: 'جهاز ميجر لاختبار عزل المحركات', d: 'فحص جودة عزل ملفات المحركات والكابلات حتى 1000 فولت.', k1: 'الجهد:', v1: '250-1000V DC', k2: 'المدى:', v2: '2000 ميجا أوم', p: 22 }
    ];
    var curCat = 'all';
    function setCat(c, btn) {
      curCat = c;
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    }
    function render() {
      var q = document.getElementById('searchInput').value.toLowerCase().trim();
      var g = document.getElementById('grid');
      var out = '';
      for (var i = 0; i < items.length; i++) {
        var x = items[i];
        if ((curCat === 'all' || x.c === curCat) && (x.t.toLowerCase().indexOf(q) !== -1 || x.d.toLowerCase().indexOf(q) !== -1 || x.s.toLowerCase().indexOf(q) !== -1)) {
          out += '<div class="product-card"><div><div class="card-top"><span class="badge">' + x.b + '</span><span class="sku">' + x.s + '</span></div><div class="p-title">' + x.t + '</div><div class="p-desc">' + x.d + '</div><div class="specs"><div class="spec-row"><span class="spec-k">' + x.k1 + '</span><span class="spec-v">' + x.v1 + '</span></div><div class="spec-row"><span class="spec-k">' + x.k2 + '</span><span class="spec-v">' + x.v2 + '</span></div></div></div><div class="card-foot"><div class="price">' + x.p + ' Pi</div><button onclick="buy(' + x.p + ',\'' + x.t + '\')" class="btn-buy">شراء الآن 🛒</button></div></div>';
        }
      }
      g.innerHTML = out || '<p style="text-align:center;grid-column:1/-1;padding:30px;color:#94a3b8;">لا توجد منتجات مطابقة لبحثك.</p>';
    }
    function authWithPi() {
      if (typeof Pi === 'undefined') { alert("يرجى الفتح داخل متصفح Pi Browser لتسجيل الدخول."); return; }
      Pi.authenticate(['username', 'payments'], function(){}).then(function(a) { document.getElementById('user-status').innerText = "✅ أهلاً: " + a.user.username; }).catch(function(e) { alert("خطأ: " + e.message); });
    }
    function buy(p, t) {
      if (typeof Pi === 'undefined') { alert("يرجى الفتح داخل متصفح Pi Browser لإتمام الدفع بعملة Pi."); return; }
      Pi.authenticate(['username', 'payments'], function(){}).then(function(a) {
        Pi.createPayment({ amount: parseFloat(p), memo: "شراء من Magid Shop: " + t, metadata: { buyer: a.user.username } }, {
          onReadyForServerApproval: function(id) { fetch('https://vercel.app', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({paymentId: id}) }); },
          onReadyForServerCompletion: function(id, tx) { fetch('https://vercel.app', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({paymentId: id, txid: tx}) }).then(function(){ alert("🎉 تم الدفع بنجاح! رقم المعاملة: " + tx); }); },
          onCancel: function() { alert("تم إلغاء الشراء."); },
          onError: function(e) { alert("خطأ: " + e.message); }
        });
      }).catch(function() { alert("يرجى تسجيل الدخول بحساب Pi أولاً."); });
    }
    render();
  </script>
</body>
</html>
