<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tech Aide | معامل القدرة</title>
    <style>
        :root {
            --dark-bg: #090d16;
            --panel-bg: rgba(17, 24, 39, 0.95);
            --neon-blue: #00d2ff;
            --neon-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #111827 0%, var(--dark-bg) 80%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(to bottom, rgba(9, 13, 22, 0.9), transparent);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
        }
        header h1 {
            margin: 0; font-size: 26px; font-weight: 800; color: #ffffff;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
        header p { margin: 8px 0 0; font-size: 14px; color: var(--neon-green); font-weight: 600; }
        .container { max-width: 600px; margin: 20px auto 40px; padding: 0 15px; }
        .card {
            background: var(--panel-bg); border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 16px; padding: 22px; margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
        }
        .card h2 { margin-top: 0; font-size: 18px; font-weight: 700; color: #ffffff; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: var(--text-muted); }
        input { width: 100%; padding: 12px; background: rgba(9, 13, 22, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; box-sizing: border-box; font-size: 16px; color: #ffffff; outline: none; }
        input:focus { border-color: var(--neon-green); }
        button {
            background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
        .result-box { background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.2); border-right: 5px solid var(--neon-green); padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .value-highlight { font-family: monospace; font-weight: bold; color: #00f5d4; font-size: 18px; text-shadow: 0 0 5px rgba(0, 245, 212, 0.5); }
        .nav-links { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .nav-links a { text-align: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-main); padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; transition: all 0.3s; }
        .nav-links a:hover { background: rgba(255, 255, 255, 0.08); }
        .footer { text-align: center; padding: 25px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
<header>
    <h1>SMART TECH AIDE ⚡</h1>
    <p>« مستودع الطاقة - لوحة حسابات مكثفات معامل القدرة »</p>
</header>
<div class="container">
    <div class="card">
        <h2>📊 حاسبة مكثفات تحسين معامل القدرة للمصانع</h2>
        <div class="form-group">
            <label for="pfPower">الحمل الفعال الكلي للمصنع بكيلوواط (kW):</label>
            <input type="number" id="pfPower" placeholder="مثال: 120">
        </div>
        <div class="form-group">
            <label for="pfCurrent">معامل القدرة الحالي المقاس بالموقع (cos φ1):</label>
            <input type="number" id="pfCurrent" step="0.01" placeholder="مثال: 0.70">
        </div>
        <button onclick="calculatePowerFactor()">احسب سعة لوحة المكثفات</button>
        <div id="pfResult" class="result-box">
            <p><strong>السعة الإجمالية المطلوبة للبنوك:</strong> <span id="kvarNeed" class="value-highlight">0</span> كيلو فار (KVAR)</p>
        </div>
    </div>
    <div class="nav-links">
        <a href="index.html">🏢 العودة لحاسبة المصانع الرئيسية العمومية</a>
        <a href="home.html">🏠 الانتقال لحاسبة أحمال وتمديدات المنازل ←</a>
        <a href="conduit.html">📐 الانتقال لحاسبة مواسير التمديد ←</a>
    </div>
</div>
<script src="https://minepi.com" async></script>
<script>
    window.onload = function() {
        if (typeof Pi !== 'undefined') {
            try { Pi.init({ version: "2.0", sandbox: true }); } catch(e) {}
        }
    };
    function calculatePowerFactor() {
        var p = parseFloat(document.getElementById('pfPower').value);
        var pf1 = parseFloat(document.getElementById('pfCurrent').value);
        if(isNaN(p) || isNaN(pf1) || pf1 <= 0 || pf1 >= 0.95) { alert("يرجى إدخال قيم صحيحة (يجب أن يكون معامل القدرة الحالي أقل من 0.95)."); return; }
        var kvar = p * (Math.tan(Math.acos(pf1)) - Math.tan(Math.acos(0.95)));
        document.getElementById('kvarNeed').innerText = kvar.toFixed(1);
        document.getElementById('pfResult').style.display = 'block';
    }
</script>
</body>
</html>
