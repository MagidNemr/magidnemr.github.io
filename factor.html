<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tech Aide | معامل القدرة</title>
    <!-- رابط المكتبة الشغالة معك تماماً -->
    <script src="https://minepi.com"></script>
    <style>
        :root { 
            --primary-color: #10b981; 
            --bg-color: #f5f5f7; 
            --card-bg: #ffffff; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: #333; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 20px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 0 15px; 
        }
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            background-color: var(--primary-color); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        button:hover { 
            background-color: #059669; 
        }
        .result-box { 
            background-color: #ecfdf5; 
            border-right: 4px solid var(--primary-color); 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 15px; 
            display: none; 
        }
        .result-box p { 
            margin: 5px 0; 
            font-size: 15px; 
        }
        .nav-links { 
            display: flex; 
            justify-content: space-around; 
            margin-top: 20px; 
            padding: 15px; 
            background: #fff; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .nav-links a { 
            color: #1e3a8a; 
            font-weight: bold; 
            text-decoration: none; 
            font-size: 15px;
        }
        .nav-links a:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

<header>
    <h1>Smart Tech Aide ⚡</h1>
    <p>مستودع الطاقة - حاسبة معامل القدرة للمصانع</p>
</header>

<div class="container">
    <div class="card">
        <h2>📊 حاسبة مكثفات تحسين معامل القدرة (Power Factor)</h2>
        <div class="form-group">
            <label for="pfPower">الحمل الكلي الفعال للمصنع بكيلوواط (kW):</label>
            <input type="number" id="pfPower" placeholder="مثال: 100">
        </div>
        <div class="form-group">
            <label for="pfCurrent">معامل القدرة الحالي المقاس بالموقع (cos φ):</label>
            <input type="number" id="pfCurrent" step="0.01" placeholder="مثال: 0.70">
        </div>
        <button onclick="calculatePowerFactor()">احسب سعة البنك المطلوب</button>
        
        <div id="pfResult" class="result-box">
            <p><strong>السعة الإجمالية المطلوبة للوحة المكثفات:</strong> <span id="kvarNeed" style="color:var(--primary-color); font-weight:bold;">0</span> كيلو فار (KVAR)</p>
        </div>
    </div>

    <div class="nav-links">
        <a href="index.html">🏢 العودة لحاسبة المصانع</a>
        <a href="home.html">🏠 الانتقال لحاسبة المنازل ←</a>
    </div>
</div>

<script>
    // تهيئة منصة Pi
    Pi.init({ version: "2.0", sandbox: true });

    function calculatePowerFactor() {
        var p = parseFloat(document.getElementById('pfPower').value);
        var pf1 = parseFloat(document.getElementById('pfCurrent').value);
        if(isNaN(p) || isNaN(pf1) || pf1 <= 0 || pf1 >= 0.95) { 
            alert("راجع إدخال القيم الحالية بشكل صحيح (يجب أن يكون أقل من 0.95)."); 
            return; 
        }
        
        // حساب القدرة غير الفعالة المطلوبة للوصول إلى معامل قدرة مستهدف 0.95
        var kvar = p * (Math.tan(Math.acos(pf1)) - Math.tan(Math.acos(0.95)));
        document.getElementById('kvarNeed').innerText = kvar.toFixed(1);
        document.getElementById('pfResult').style.display = 'block';
    }
</script>

</body>
</html>
