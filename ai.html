<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم المستشارين الذكيين - Smart Tech Aide</title>
    <style>
        body {
            background-color: #0b1116;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header-bar {
            background: #111c24;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
            box-sizing: border-box;
        }
        .header-bar h2 {
            color: #00ffcc;
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }
        .back-link {
            color: #a0aec0;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 12px;
            border: 1px solid #1a2a35;
            border-radius: 6px;
            background: #0d161c;
            transition: 0.2s;
        }
        .back-link:hover {
            color: #00ffcc;
            border-color: #00ffcc;
        }
        .menu-container {
            width: 100%;
            background: #111c24;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-title {
            text-align: center;
            margin-top: 0;
            font-size: 14px;
            color: #a0aec0;
        }
        .advisor-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a2a35;
            border: 1px solid #2d404e;
            border-radius: 8px;
            padding: 15px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }
        .advisor-btn:hover {
            border-color: #00ffcc;
            background: #16242e;
            transform: translateY(-2px);
        }
        .advisor-btn .arrow {
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- الشريط العلوي للعودة للرئيسية -->
        <div class="header-bar">
            <h2>🤖 قسم الذكاء الاصطناعي (AI)</h2>
            <a href="index.html" class="back-link">⬅️ الرئيسية</a>
        </div>

        <!-- قائمة المستشارين الحالية -->
        <div class="menu-container">
            <p class="menu-title">اختر الخدمات الذكية المتاحة:</p>
            
            <!-- زر مستشار الأدوية والطب البديل -->
            <a href="medical.html" class="advisor-btn">
                <span>💊 مستشار الأدوية والطب البديل الذكي</span>
                <span class="arrow">⬅️</span>
            </a>

            <!-- زر المكتبة الرقمية والتلخيص -->
            <a href="library.html" class="advisor-btn">
                <span>📚 المكتبة الرقمية والتلخيص الذكي</span>
                <span class="arrow">⬅️</span>
            </a>
            
            <!-- زر مستشار السيارات والمخالفات -->
            <a href="cars.html" class="advisor-btn">
                <span>🚗 مستشار السيارات والمخالفات الذكي</span>
                <span class="arrow">⬅️</span>
            </a>
        </div>
    </div>

</body>
</html>
