<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستشار الكهربائي الذكي - Smart Tech Aide</title>
    <style>
        /* تصميم متناسق تماماً مع الألوان الداكنة لمشروعك */
        body {
            background-color: #0b1116;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header-bar {
            background: #111c24;
            border-bottom: 2px solid #00ffcc;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.15);
        }
        .header-bar h2 {
            color: #00ffcc;
            margin: 0;
            font-size: 18px;
        }
        .back-link {
            color: #a0aec0;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border: 1px solid #1a2a35;
            border-radius: 6px;
            background: #0d161c;
            transition: 0.2s;
        }
        .back-link:hover {
            color: #00ffcc;
            border-color: #00ffcc;
        }
        .iframe-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            background: #0b1116;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- شريط علوي أنيق يحتوي على زر العودة للرئيسية -->
    <div class="header-bar">
        <h2>⚡ المستشار الكهربائي الذكي (AI) - النمر للمعلوميات</h2>
        <a href="index.html" class="back-link">⬅️ العودة للرئيسية</a>
    </div>

    <!-- حاوية الشات بوت المضمن بأمان كامل -->
    <div class="iframe-container">
        <iframe
            src="https://www.chatbase.co/chatbot-iframe/My4yAuZurG3j0QBX22rkp"
            referrerpolicy="no-referrer-when-downgrade"
            allow="microphone"
        ></iframe>
    </div>

</body>
</html>
