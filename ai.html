<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستشار الكهربائي الذكي - Smart Tech Aide</title>
    <style>
        body {
            background-color: #0b1116;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header-bar {
            background: #111c24;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
            box-sizing: border-box;
        }
        .header-bar h2 {
            color: #00ffcc;
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }
        .back-link {
            color: #a0aec0;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 12px;
            border: 1px solid #1a2a35;
            border-radius: 6px;
            background: #0d161c;
        }
        .iframe-container {
            width: 100%;
            height: 75vh;
            background: #111c24;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            overflow: hidden;
            box-sizing: border-box;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-bar">
            <h2>⚡ المستشار الكهربائي الذكي (AI)</h2>
            <a href="index.html" class="back-link">⬅️ العودة للرئيسية</a>
        </div>

        <div class="iframe-container">
            <iframe
                src="https://chatbase.co"
                referrerpolicy="no-referrer-when-downgrade"
                allow="microphone"
            ></iframe>
        </div>
    </div>

</body>
</html>
