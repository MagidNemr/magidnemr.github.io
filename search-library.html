<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الفنية - مدونة النمر للمعلوميات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 500px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn-go {
            display: inline-block;
            padding: 14px 30px;
            font-size: 16px;
            background-color: #e5a93b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(229, 169, 59, 0.2);
            transition: background 0.3s;
        }
        .btn-go:hover {
            background-color: #d4982a;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 المكتبه الفنيه</h1>
    <p>مكتبة البحث وتحميل أي كتاب فني أو هندسي مجاناً عبر مدونة النمر للمعلوميات.</p>
    
    <!-- استبدل الرابط أدناه برابط المقال الذي نشرته في بلوجر -->
    <a href="https://blogspot.com" id="blogLink" class="btn-go">انتقل للمدونة وابحث عن كتابك الآن</a>
</div>

<script>
    // كود لتوجيه الزائر تلقائياً بعد 3 ثوانٍ لزيادة الأرباح، أو يمكنه الضغط مباشرة على الزر
    window.onload = function() {
        var articleUrl = "https://magid-nemr.blogspot.com/2026/10/blog-post_08.html"; // 👈 ضع رابط المقال هنا بين العلامتين
        
        document.getElementById("blogLink").href = articleUrl;
        
        setTimeout(function() {
            window.location.href = articleUrl;
        }, 3000); // التوجيه التلقائي بعد 3 ثوانٍ
    };
</script>

</body>
</html>
