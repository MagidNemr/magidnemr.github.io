<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الفنية - بحث عن الكتب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #e5a93b;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #e5a93b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #d4982a;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: translateY(-5px);
        }
        .book-card img {
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .book-title {
            font-size: 15px;
            font-weight: bold;
            margin: 5px 0;
            color: #2c3e50;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 40px;
        }
        .book-author {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 15px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .btn-view {
            display: block;
            padding: 8px 12px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-view:hover {
            background-color: #2980b9;
        }
        .loading, .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>المكتبه الفنيه</h1>
    <div class="subtitle">مكتبه وتحتها اكتب بحثي عن أى كتاب</div>

    <!-- صندوق البحث -->
    <div class="search-box">
        <input type="text" id="bookQuery" placeholder="اكتب اسم الكتاب أو التخصص الفني أو المؤلف...">
        <button id="searchButton">ابحث</button>
    </div>

    <!-- شبكة عرض النتائج -->
    <div class="results-grid" id="booksResult">
        <!-- سيتم توليد الكروت هنا ديناميكياً بواسطة الجافاسكريبت -->
    </div>
</div>

<script>
    document.getElementById('searchButton').addEventListener('click', executeBookSearch);
    document.getElementById('bookQuery').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            executeBookSearch();
        }
    });

    async function executeBookSearch() {
        const query = document.getElementById('bookQuery').value.trim();
        const container = document.getElementById('booksResult');

        if (!query) {
            alert('يرجى كتابة كلمة للبحث أولاً!');
            return;
        }

        container.innerHTML = '<div class="loading">⏳ جاري البحث في المكتبة الفنية...</div>';

        try {
            // استدعاء واجهة برمجة تطبيقات Google Books للبحث عن العناوين المدخلة
            const url = `https://googleapis.com{encodeURIComponent(query)}&maxResults=12`;
            const response = await fetch(url);
            const data = await response.json();

            container.innerHTML = ''; // تفريغ الحاوية

            if (!data.items || data.items.length === 0) {
                container.innerHTML = '<div class="no-results">❌ عذراً، لم نجد كتباً تطابق بحثك. جرب كلمات أخرى.</div>';
                return;
            }

            data.items.forEach(item => {
                const volumeInfo = item.volumeInfo;
                const title = volumeInfo.title || 'عنوان غير متوفر';
                const authors = volumeInfo.authors ? volumeInfo.authors.join(', ') : 'مؤلف غير معروف';
                
                // جلب صورة الغلاف البديلة في حال عدم توفر غلاف أصلي
                let thumbnail = 'https://placeholder.com';
                if (volumeInfo.imageLinks && volumeInfo.imageLinks.thumbnail) {
                    // استبدال http بـ https لضمان عملها بأمان داخل Pi Browser
                    thumbnail = volumeInfo.imageLinks.thumbnail.replace('http://', 'https://');
                }
                
                const previewUrl = volumeInfo.previewLink || '#';

                // بناء كارت الكتاب
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${thumbnail}" alt="${title}">
                    <div class="book-title" title="${title}">${title}</div>
                    <div class="book-author">${authors}</div>
                    <a href="${previewUrl}" target="_blank" class="btn-view">قراءة / معاينة</a>
                `;
                container.appendChild(card);
            });

        } catch (error) {
            console.error('Error fetching data:', error);
            container.innerHTML = '<div class="no-results" style="color: red;">⚠️ حدث خطأ في الاتصال بالخادم، يرجى المحاولة لاحقاً.</div>';
        }
    }
</script>

</body>
</html>
