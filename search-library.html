<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الفنية - مدونة النمر للمعلوميات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #e5a93b;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #e5a93b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #d4982a;
        }
        .hint-text {
            font-size: 13px;
            color: #95a5a6;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>المكتبه الفنيه</h1>
    <div class="subtitle">ابحث عن أى كتاب للذهاب إلى صفحة التحميل المباشر بمدونة النمرللمعلوميات</div>

    <!-- صندوق البحث المباشر -->
    <div class="search-box">
        <input type="text" id="bookQuery" placeholder="اكتب اسم الكتاب أو التخصص الفني هنا...">
        <button id="searchButton">ابحث</button>
    </div>

    <div class="hint-text">
        سيتم توجيهك تلقائياً لنتائج التحميل الآمنة داخل مدونة النمر للمعلومات.
    </div>
</div>

<script>
    document.getElementById('searchButton').onclick = redirectToBlog;
    document.getElementById('bookQuery').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            redirectToBlog();
        }
    });

    function redirectToBlog() {
        var query = document.getElementById('bookQuery').value.trim();

        if (!query) {
            alert('يرجى كتابة اسم الكتاب أولاً للبحث!');
            return;
        }

        // تحويل المستخدم فوراً لصفحة البحث داخل مدونة النمر بدون أي تعليق
        var blogUrl = 'https://magid-nemr.blogspot.com/' + encodeURIComponent(query);
        window.location.href = blogUrl;
    }
</script>

</body>
</html>
