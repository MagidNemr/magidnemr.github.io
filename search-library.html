<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الفنية - بحث وتحميل الكتب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #e5a93b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .book-card {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .book-card img {
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .book-title {
            font-size: 15px;
            font-weight: bold;
            margin: 5px 0;
            color: #2c3e50;
        }
        .btn-download {
            display: block;
            padding: 10px 12px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
        }
        .loading, .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>المكتبه الفنيه</h1>
    <div class="subtitle">ابحث عن أي كتاب للانتقال إلى مدونة النمر للمعلوميات للتحميل المباشر</div>

    <div class="search-box">
        <input type="text" id="bookQuery" placeholder="اكتب اسم الكتاب هنا (مثال: Classic Control)...">
        <button id="searchButton">ابحث</button>
    </div>

    <div class="results-grid" id="booksResult"></div>
</div>

<script>
    document.getElementById('searchButton').onclick = executeBookSearch;
    
    function executeBookSearch() {
        var query = document.getElementById('bookQuery').value.trim();
        var container = document.getElementById('booksResult');

        if (!query) {
            alert('يرجى كتابة اسم الكتاب أولاً!');
            return;
        }

        container.innerHTML = '<div class="loading">⏳ جاري البحث وجلب الروابط المباشرة...</div>';

        // استخدام الاتصال التقليدي المتوافق مع متصفحات الأجهزة القديمة وبيئة Pi
        var xhr = new XMLHttpRequest();
        var url = 'https://googleapis.com' + encodeURIComponent(query) + '&maxResults=10';
        
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                container.innerHTML = ''; 
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (!data.items || data.items.length === 0) {
                        container.innerHTML = '<div class="no-results">❌ لم نجد كتباً تطابق بحثك. جرب كلمة أخرى مثل "Control".</div>';
                        return;
                    }

                    data.items.forEach(function(item) {
                        var volumeInfo = item.volumeInfo;
                        var title = volumeInfo.title || 'عنوان غير متوفر';
                        
                        var thumbnail = 'https://placeholder.com';
                        if (volumeInfo.imageLinks && volumeInfo.imageLinks.thumbnail) {
                            thumbnail = volumeInfo.imageLinks.thumbnail.replace('http://', 'https://');
                        }
                        
                        // رابط التوجيه لمدونة النمر مع كلمة البحث
                        var blogSearchUrl = 'https://magid-nemr.blogspot.com/' + encodeURIComponent(title);

                        var card = document.createElement('div');
                        card.className = 'book-card';
                        card.innerHTML = '<img src="' + thumbnail + '">' +
                                         '<div class="book-title">' + title + '</div>' +
                                         '<a href="' + blogSearchUrl + '" target="_blank" class="btn-download">📥 تحميل من المدونة</a>';
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="no-results" style="color: red;">⚠️ حدث خطأ في الشبكة. تأكد من اتصال الإنترنت داخل Pi Browser.</div>';
                }
            }
        };
        xhr.send();
    }
</script>

</body>
</html>
