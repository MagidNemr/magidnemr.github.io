<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #2ea44f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.2);
        }
        h2 {
            text-align: center;
            color: #2ea44f;
            margin-top: 0;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            background-color: #0d1117;
            margin-bottom: 15px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .user-msg {
            background-color: #238636;
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            margin-left: auto;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2ea44f;
        }
        button {
            padding: 12px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea44f;
        }
        button:disabled {
            background-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<!-- الواجهة الفخمة والمحدثة تلقائياً بالكامل عبر السحابة الذكية -->
<div class="main-dashboard-container" style="max-width: 600px; margin: 0 auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; text-align: right;">
    
    <!-- قسم الأزرار والخدمات السريعة (3 خيارات فخمة) -->
    <div class="services-grid" style="display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px;">
        
        <!-- الخيار الأول: إدارة المرور -->
        <a href="https://ppo.gov.eg" target="_blank" style="text-decoration: none; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 15px 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: transform 0.2s;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 24px;">🚔</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">إدارة المرور ونظام المخالفات</strong>
                    <span style="font-size: 12px; color: #94a3b8;">اضغط هنا للانتقال الفوري ومعرفة مخالفاتك رسمياً</span>
                </div>
            </div>
            <span style="font-size: 18px; color: #10b981;">←</span>
        </a>

        <!-- الخيار الثاني: حاسبة التراخيص الكاملة (محدثة تلقائياً عبر سحابة البوت بدون تدخل يدوي) -->
        <div style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                <span style="font-size: 24px;">💵</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">حاسبة تراخيص السيارات الإجمالية (تحديثات إلكترونية فورية)</strong>
                    <span style="font-size: 12px; color: #94a3b8;">الحساب ديناميكي ومربوط بالشبكة لقراءة أي تعديل رسمي في الرسوم فوراً</span>
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px;">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="ccInput" placeholder="أدخل السعة اللترية (مثال: 1600)" style="flex: 2; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-size: 14px;">
                    
                    <select id="yearsInput" style="flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-size: 14px; cursor: pointer;">
                        <option value="1">سنة واحدة</option>
                        <option value="2">سنتين (2)</option>
                        <option value="3">3 سنوات</option>
                    </select>
                </div>
                <button onclick="calculateLicenseOnline()" style="background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%;">احسب التكلفة اللحظية</button>
            </div>
            <div id="calcResult" style="font-size: 14px; color: #e2e8f0; text-align: right; margin-top: 15px; line-height: 1.6; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: none;"></div>
        </div>

        <!-- الخيار الثالث: محرك البحث والبوت المباشر الشغال 100% الخاص بك -->
        <div style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                <span style="font-size: 24px;">🔍</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">معرفة مواصفات وفحص أي سيارة</strong>
                    <span style="font-size: 12px; color: #94a3b8;">تصفح مواصفات سيارتك مباشرة عبر البوت الذكي المحدث</span>
                </div>
            </div>

            <!-- تضمين الرابط الرسمي الشغال والآمن لبوتك الخاص بالسيارات -->
            <div style="width: 100%; height: 450px; border-radius: 8px; overflow: hidden; border: 1px solid #334155;">
                <iframe
                    src="https://botpress.cloud"
                    width="100%"
                    height="100%"
                    style="border: none;"
                    allow="microphone; geolocation; clipboard-write">
                </iframe>
            </div>
        </div>

    </div>
</div>

<script>
    // دالة الاتصال المباشر والذكي بالسحابة لحساب التراخيص فوراً بأرقام محدثة دائماً من السيرفر وبدون كورس CORS
    async function calculateLicenseOnline() {
        const cc = document.getElementById('ccInput').value.trim();
        const years = document.getElementById('yearsInput').value;
        const resultDiv = document.getElementById('calcResult');
        
        if (!cc || parseInt(cc) <= 0) {
            resultDiv.innerHTML = "❌ يرجى إدخال سعة لترية صحيحة للمحرك أولاً.";
            resultDiv.style.color = "#ef4444";
            resultDiv.style.display = "block";
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.style.color = "#10b981";
        resultDiv.innerHTML = `<div style="text-align:center;">🔄 جاري الاتصال بالسحابة لقراءة أحدث الأسعار والرسوم الرسمية من المرور...</div>`;

        try {
            // إرسال الطلب لـ API المحادثة السحابي لبوتك ليعالج المدخلات ويفحص الويب عبر الـ Web Search
            const response = await fetch("https://botpress.cloud", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-user-id": "calc_user_" + Math.random().toString(36).substring(2, 10)
                },
                body: JSON.stringify({ 
                    text: `احسب بالتفصيل الممل إجمالي مصاريف ورسوم ترخيص سيارة ملاكي سعة ${cc} سي سي لمدة ${years} سنوات في مصر حالياً شاملة الضريبة والتأمين والرسوم بعد آخر قرارات وتخفيضات وزارة الداخلية وجداول الرسوم الرسمية` 
                })
            });

            const data = await response.json();

            if (data.responses && data.responses.length > 0) {
                // تصفية وعرض النصوص بشكل فخم للغاية
                let responseText = "";
                data.responses.forEach(resp => {
                    if (resp.text) responseText += resp.text + "\n";
                });
                
                resultDiv.style.color = "#ffffff";
                resultDiv.innerHTML = `<div style="color: #10b981; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 5px;">📊 بيان الرسوم السحابي والمحدث تلقائياً:</div>` + responseText.replace(/\n/g, "<br>");
            } else {
                resultDiv.style.color = "#ef4444";
                resultDiv.innerHTML = "⚠️ لم نتمكن من حساب التكلفة إلكترونياً، يرجى كتابة السؤال يدوياً داخل صندوق البوت بالأسفل.";
            }
        } catch (error) {
            console.error(error);
            resultDiv.style.color = "#ef4444";
            resultDiv.innerHTML = "❌ حدث خطأ في الاتصال بالشبكة التلقائية للمرور، يرجى إعادة المحاولة لاحقاً.";
        }
    }
</script>

</body>
</html>
