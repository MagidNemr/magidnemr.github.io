<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 95vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: #161b22;
            border: 2px solid #2ea44f; /* الإطار الأخضر المميز */
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(46, 164, 79, 0.25);
            display: flex;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            color: #2ea44f; /* اللون الأخضر لعناوينك */
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }
        .chat-frame-wrapper {
            flex: 1;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #30363d;
            background-color: #0d1117;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏎️ مستشار وموسوعة السيارات الشامل</h2>
    
    <!-- تضمين البوت بنجاح داخل الإطار الأخضر لمنع أي مشاكل اتصال -->
    <div class="chat-frame-wrapper">
        <iframe 
            src="https://cdn.botpress.cloud/webchat/v3.7/shareable.html?configUrl=https://files.bpcontent.cloud/2026/10/23/12/20261023124213-5N6Q06MP.json"
            allow="microphone; geolocation;">
        </iframe>
    </div>
</div>

</body>
</html>
