<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الذكي</title>
    <style>
        :root {
            --bg-color: #0b1116; 
            --primary-color: #00ffcc; 
            --btn-color: #ff2a74; 
            --card-bg: rgba(17, 24, 39, 0.95);
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            direction: rtl;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .card p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .card input {
            width: 90%;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }

        .card input:focus {
            border-color: var(--primary-color);
        }

        .card button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            transition: transform 0.2s;
            margin-bottom: 8px;
        }

        .card button:hover {
            transform: scale(1.03);
        }

        .gov-link {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .gov-link:hover {
            text-decoration: underline;
            color: #fff;
        }

        /* تنسيق الصندوق المدمج الفخم ليصبح هو البوت الفعلي بملء المساحة */
        .chat-section {
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            overflow: hidden;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
            width: 100%;
        }

        .chat-header {
            background-color: #111c24;
            color: var(--primary-color);
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--primary-color);
            text-align: right;
        }

        .chat-body {
            height: 480px; 
            background-color: #0a0a0a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الكروت الفخمة وتصميمك الأصلي النظيف بالكامل ومعه رابط النيابة العامة للمخالفات -->
        <div class="cards-grid">
            <div class="card">
                <h3>🔧 المواصفات الفنية</h3>
                <p>استعلم عن مواصفات السيارة.</p>
                <input type="text" id="brandInput" placeholder="أدخل ماركة السيارة...">
                <button onclick="sendToBotpress('specs')">فحص المواصفات</button>
            </div>

            <div class="card">
                <h3>🚦 الاستعلام عن المخالفات</h3>
                <p>المخالفات المرورية الصادرة الاسترشادية.</p>
                <input type="text" id="plateInput" placeholder="أدخل رقم اللوحة...">
                <button onclick="sendToBotpress('violations')">عرض المخالفات</button>
                <br>
                <a href="https://ppo.gov.eg" target="_blank" class="gov-link">🌐 رابط بوابة النيابة العامة للمرور الرسمية</a>
            </div>

            <div class="card">
                <h3>💳 حساب رسوم التراخيص</h3>
                <p>رسوم التراخيص وتجديد المركبات داخل مصر وفقاً للسعة والموديل.</p>
                <input type="text" id="ccInput" placeholder="أدخل السعة اللترية (مثال: 1600)...">
                <button onclick="sendToBotpress('fees')">حساب الرسوم</button>
            </div>
        </div>

<!-- الصندوق الأسود المدمج اللي هيظهر جواه البوت تلقائياً -->
    <div id="myCarBot" style="width: 100%; height: 500px; border: none; margin-top: 20px;"></div>
</div>

<!-- استدعاء سكريبت تشغيل البوت الرسمي بالإصدار المباشر v3 -->
<script src="https://botpress.cloud"></script>
<script>
  // تهيئة وتشغيل البوت جوه الصندوق المخصص
  window.botpress.init({
    configUrl: "https://bpcontent.cloud",
    containerId: "myCarBot",
    layoutWidth: "100%",
    layoutHeight: "100%",
    hideWidget: true 
  });

  // الدالة السلسة لإرسال الأسئلة فوراً كرسالة عادية جوه الشات وبدون أي ريفريش
  function sendToBotpress(type) {
    let textQuery = "";
    
    if (type === 'specs') {
      const brand = document.getElementById('brandInput').value.trim();
      if (!brand) return alert("من فضلك أدخل ماركة السيارة أولاً");
      textQuery = `مواصفات السياره ماركه ${brand}`;
    } 
    else if (type === 'violations') {
      const plate = document.getElementById('plateInput').value.trim();
      if (!plate) return alert("من فضلك أدخل رقم اللوحة أولاً");
      textQuery = `استعلام عن مخالفات السياره رقم ${plate}`;
    } 
    else if (type === 'fees') {
      const cc = document.getElementById('ccInput').value.trim();
      if (!cc) return alert("من فضلك أدخل السعة اللترية أولاً");
      textQuery = `حساب رسوم ترخيص سيارة سعة ${cc} سي سي`;
    }

    // إرسال النص مباشرة كرسالة عادية جوه الشات وبدون أي ريفريش
    if (textQuery && window.botpress) {
      window.botpress.sendMessage(textQuery);
    }
  }
</script>
        
</body>
</html>
