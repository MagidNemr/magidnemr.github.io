<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار السيارات والمخالفات الذكي - Smart Tech Aide</title>
    <style>
        body {
            background-color: #0b1116;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header-bar {
            background: #111c24;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
        }
        .header-bar h2 {
            color: #00ffcc;
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }
        .back-link {
            color: #a0aec0;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 12px;
            border: 1px solid #1a2a35;
            border-radius: 6px;
            background: #0d161c;
            transition: 0.2s;
        }
        .back-link:hover {
            color: #00ffcc;
            border-color: #00ffcc;
        }
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #111c24;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.2);
        }
        .card h3 {
            color: #00ffcc;
            font-size: 14px;
            margin: 0 0 6px 0;
        }
        .card p {
            font-size: 11px;
            color: #a0aec0;
            margin: 0;
        }
        .full-card {
            grid-column: span 2;
        }
        .chat-section {
            background: #111c24;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
        }
        .chat-header {
            color: #00ffcc;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid #1a2a35;
            padding-bottom: 6px;
        }
        .iframe-container {
            width: 100%;
            height: 380px;
            border-radius: 6px;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- الهيدر العلوي الفخم -->
        <div class="header-bar">
            <h2>🚗 مستشار السيارات والمخالفات الذكي</h2>
            <a href="ai.html" class="back-link">⬅️ عودة لقسم AI</a>
        </div>

        <!-- الكروت الجذابة القديمة بنظام الـ Grid -->
        <div class="services-grid">
            <div class="card" onclick="activateService('المواصفات الفنية')">
                <h3>🛠️ المواصفات الفنية</h3>
                <p>استعلم عن مواصفات السيارة وقدرة المحرك</p>
            </div>
            
            <div class="card" onclick="activateService('الاستعلام عن المخالفات')">
                <h3>🚦 الاستعلام عن المخالفات</h3>
                <p>عرض تفاصيل ومخالفات المرور الصادرة</p>
            </div>
            
            <div class="card full-card" onclick="activateService('حساب رسوم التراخيص')">
                <h3>💳 حساب رسوم التراخيص</h3>
                <p>رسوم التراخيص وتجديد المركبات داخل مصر وفقاً للسعة والموديل</p>
            </div>
        </div>

        <!-- منطقة الشات الأنيقة المدمجة ببتروس -->
        <div class="chat-section">
            <div class="chat-header">💬 المستشار الهندسي للمرور والسيارات</div>
            <div class="iframe-container">
                <iframe
                    id="botpressIframe"
                    src="https://botpress.cloud"
                    referrerpolicy="no-referrer-when-downgrade"
                ></iframe>
            </div>
        </div>
    </div>

    <script>
    // ربط كروت الواجهة بالشات التفاعلي لبتروس تلقائياً
    function activateService(serviceName) {
        const iframe = document.getElementById('botpressIframe');
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({
                type: 'text',
                text: "أريد خدمة " + serviceName
            }, '*');
        }
    }
    </script>
</body>
</html>
