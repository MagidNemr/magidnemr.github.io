<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #2ea44f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.2);
        }
        h2 {
            text-align: center;
            color: #2ea44f;
            margin-top: 0;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            background-color: #0d1117;
            margin-bottom: 15px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .user-msg {
            background-color: #238636;
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            margin-left: auto;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2ea44f;
        }
        button {
            padding: 12px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea44f;
        }
        button:disabled {
            background-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<!-- الواجهة الفخمة والمحدثة بالكامل لمستشار السيارات الشامل 2026 -->
<div class="main-dashboard-container" style="max-width: 600px; margin: 0 auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; text-align: right;">
    
    <!-- قسم الأزرار والخدمات السريعة -->
    <div class="services-grid" style="display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px;">
        
        <!-- الزر الأول: إدارة المرور -->
        <a href="https://ppo.gov.eg" target="_blank" style="text-decoration: none; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 15px 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: transform 0.2s;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 24px;">🚔</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">إدارة المرور ونظام المخالفات</strong>
                    <span style="font-size: 12px; color: #94a3b8;">اضغط هنا للانتقال الفوري ومعرفة مخالفاتك رسمياً</span>
                </div>
            </div>
            <span style="font-size: 18px; color: #10b981;">←</span>
        </a>

        <!-- الزر الثاني: حاسبة التراخيص الشاملة لعدة سنوات (تحديثات أواخر 2026) -->
        <div style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                <span style="font-size: 24px;">💵</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">حاسبة تراخيص السيارات الإجمالية المحدثة</strong>
                    <span style="font-size: 12px; color: #94a3b8;">احسب الضريبة + التأمين الإجباري + الرسوم الإدارية لعدد السنوات المطلوبة</span>
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px;">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="ccInput" placeholder="أدخل السعة اللترية (مثال: 1600)" style="flex: 2; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-size: 14px;">
                    
                    <select id="yearsInput" style="flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-size: 14px; cursor: pointer;">
                        <option value="1">سنة واحدة</option>
                        <option value="2">سنتين (2)</option>
                        <option value="3">3 سنوات</option>
                    </select>
                </div>
                <button onclick="calculateLicenseFull()" style="background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%;">احسب التكلفة الإجمالية</button>
            </div>
            <div id="calcResult" style="font-size: 14px; font-weight: bold; color: #e2e8f0; text-align: right; margin-top: 15px; line-height: 1.6; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: none;"></div>
        </div>

        <!-- القسم الثالث: محرك البحث الفخم المربوط بالبوت مباشرة -->
        <div style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                <span style="font-size: 24px;">🔍</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">معرفة مواصفات أي سيارة</strong>
                    <span style="font-size: 12px; color: #94a3b8;">تصفح مواصفات سيارتك مباشرة عبر البوت الذكي</span>
                </div>
            </div>

            <!-- تضمين الشات المباشر المخصص للـ Embed ليعمل 100% بدون تعليق -->
            <div style="width: 100%; height: 350px; border-radius: 8px; overflow: hidden; border: 1px solid #334155;">
                <iframe
                    src="https://cdn.botpress.cloud/webchat/v3.7/shareable.html?configUrl=https://files.bpcontent.cloud/2026/10/23/12/20261023124213-5N6Q06MP.json"
                    width="100%"
                    height="100%"
                    style="border: none;"
                    allow="microphone; geolocation; clipboard-write">
                </iframe>
            </div>
        </div>

    </div>
</div>

<script>
    // دالة حاسبة التراخيص الشاملة والمحدثة وفقاً لعدد السنوات والشرائح اللترية 2026
    function calculateLicenseFull() {
        const cc = parseInt(document.getElementById('ccInput').value);
        const years = parseInt(document.getElementById('yearsInput').value);
        const resultDiv = document.getElementById('calcResult');
        
        if (!cc || cc <= 0) {
            resultDiv.innerHTML = "❌ يرجى إدخال سعة لترية صحيحة للمحرك أولاً.";
            resultDiv.style.color = "#ef4444";
            resultDiv.style.display = "block";
            return;
        }

        // 1. حساب الضريبة السنوية الأساسية بحسب الفئة اللترية
        let annualTax = 0;
        let categoryName = "";

        if (cc <= 1030) {
            annualTax = 225;
            categoryName = "سيارة اقتصادية (حتى 1030 CC)";
        } else if (cc > 1030 && cc <= 1330) {
            annualTax = 225;
            categoryName = "سيارة عائلية صغيرة (من 1030 إلى 1330 CC)";
        } else if (cc > 1330 && cc <= 1630) {
            annualTax = 750;
            categoryName = "سيارة متوسطة (من 1330 إلى 1630 CC)";
        } else if (cc > 1630 && cc <= 2030) {
            annualTax = 3000;
            categoryName = "سيارة فوق المتوسطة (من 1630 إلى 2030 CC)";
        } else {
            annualTax = cc * 2.5; // الحساب النسبي التقديري للسيارات الفارهة ذات السعة العالية جداً
            categoryName = "سيارة فارهة / سعة عالية (أعلى من 2030 CC)";
        }

        // ضرب الضريبة في عدد السنوات المختارة
        let totalTax = annualTax * years;

        // 2. الرسوم الإدارية والتأمينات والملصق الإلكتروني (يتم تكرار بعضها بحسب عدد السنوات)
        const compulsoryInsurancePerYear = 615; // التأمين الإجباري السنوي للملاكي
        const electronicStickerPerYear = 150;   // رسوم الملصق الإلكتروني السنوية
        
        const medicalCheck = 385;               // الكشف الطبي ونموذج الفحص (يدفع مرة واحدة لكل دورة ترخيص)
        const platesFee = 350;                  // رسوم تطوير اللوحات المعدنية (تدفع مرة واحدة عند تجديد اللوحات أو الدورة)
        const adminForms = 210;                 // الأوراق والنماذج وحافظة الملفات وطابع الشرطة

        // حساب الرسوم المتغيرة بناءً على عدد السنوات
        let totalInsurance = compulsoryInsurancePerYear * years;
        let totalSticker = electronicStickerPerYear * years;

        // إجمالي المصاريف الثابتة والإدارية الكلية للمدة كاملة
        const totalFixedFees = medicalCheck + platesFee + adminForms + totalInsurance + totalSticker;
        
        // الحسبة الإجمالية النهائية الشاملة لكل المصاريف
        const totalCostFinal = totalTax + totalFixedFees;

        // عرض النتائج التفصيلية الفخمة بناء على عدد السنوات المختارة للمستخدم
        resultDiv.style.display = "block";
        resultDiv.style.color = "#ffffff";
        resultDiv.innerHTML = `
            📌 <strong style="color:#10b981;">تصنيف المركبة:</strong> ${categoryName}<br>
            📅 <strong style="color:#10b981;">مدة الترخيص المحسوبة:</strong> ${years === 1 ? 'سنة واحدة' : years === 2 ? 'سنتين (2)' : '3 سنوات'} <br>
            💵 <strong style="color:#10b981;">إجمالي الضريبة الأساسية (${years} سنوات):</strong> ${Math.round(totalTax)} جنيه<br>
            🛡️ <strong style="color:#10b981;">إجمالي التأمين الإجباري (${years} سنوات):</strong> ${totalInsurance} جنيه<br>
            🏷️ <strong style="color:#10b981;">إجمالي الملصق الإلكتروني واللوحات:</strong> ${totalSticker + platesFee} جنيه<br>
            🏥 <strong style="color:#10b981;">الكشف الطبي والأوراق الإدارية بالمرور:</strong> ${medicalCheck + adminForms} جنيه<br>
            <hr style="border-color:#334155; margin: 12px 0;">
            💰 <strong style="color:#10b981; font-size: 16px;">إجمالي مصاريف الترخيص بالمرور لـ (${years} سنوات):</strong> 
            <span style="color:#10b981; font-size: 22px; display:block; text-align:center; font-weight:bold; margin-top:5px; background:#1e293b; padding:8px; border-radius:6px; border:1px dashed #10b981;">${Math.round(totalCostFinal)} جنيه مصري</span>
            <span style="font-size: 11px; color:#94a3b8; display:block; text-align:center; margin-top:5px;">* (هذه الحسبة تقديرية شاملة لكافة الرسوم والضرائب الإلزامية بداخل المرور ولا تشمل المخالفات)</span>
        `;
    }
</script>
</body>
</html>
