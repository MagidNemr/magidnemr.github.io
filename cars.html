<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #2ea44f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.2);
        }
        h2 {
            text-align: center;
            color: #2ea44f;
            margin-top: 0;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            background-color: #0d1117;
            margin-bottom: 15px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .user-msg {
            background-color: #238636;
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            margin-left: auto;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2ea44f;
        }
        button {
            padding: 12px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea44f;
        }
        button:disabled {
            background-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏎️ مستشار وموسوعة السيارات الشامل</h2>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">مرحباً بك! أنا مستشارك الذكي المتخصص في السيارات. اسألني عن مواصفات أي سيارة أو عطل وسأجيبك فوراً بدقة واختصار.</div>
    </div>
 <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا عن مواصفات السيارات..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>
  <!-- استبدال صندوق الكتابة ببوت شات Botpress -->
<div class="input-area" style="height: 500px; padding: 0; overflow: hidden; background: transparent;">
  <!-- كود تشغيل وربط بوت السيارات من Botpress -->
<script src="https://botpress.cloud"></script>
<script>
    // تهيئة البوت باستخدام الرابط والملف الخاص بك
    let botClient = null;

    window.addEventListener('load', async () => {
        try {
            // جلب الإعدادات من رابط الـ json الخاص ببوتك وتفعيله
            const configUrl = "https://bpcontent.cloud";
            const response = await fetch(configUrl);
            const config = await response.json();
            
            // إنشاء اتصال مباشر بالبوت خلف الكواليس
            botClient = window.BotpressWebchat.createClient({ config });
        } catch (error) {
            console.error("فشل تهيئة البوت:", error);
        }
    });

    async function sendMessage() {
        const userInput = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const messageText = userInput.value.trim();

        if (messageText === "") return;

        // 1. عرض كلمة المستخدم فوراً في الأعلى مكان (لانوس)
        chatBox.innerHTML = `
            <div class="message" style="background-color: #10b981; color: white; padding: 10px; margin-bottom: 10px; border-radius: 5px; text-align: right;">
                ${messageText}
            </div>
            <div class="message u1-msg" id="botResponse" style="background-color: #262626; color: #a3a3a3; padding: 10px; border-radius: 5px; text-align: right;">
                جاري التفكير والرد...
            </div>
        `;

        userInput.value = "";

        if (!botClient) {
            document.getElementById("botResponse").innerText = "برجاء الانتظار، جاري تحميل اتصال البوت...";
            return;
        }

        try {
            // 2. إرسال الرسالة إلى البوت عبر السكربت الرسمي
            const payload = await botClient.sendMessage({ text: messageText });
            const botResponseDiv = document.getElementById("botResponse");

            // 3. استقبال الرد وعرضه مكان كلمة الخطأ
            if (payload && payload.responses && payload.responses.length > 0) {
                botResponseDiv.innerText = payload.responses[0].text;
                botResponseDiv.style.color = "#ffffff";
            } else {
                botResponseDiv.innerText = "فهمت سؤالك، ولكن لم أجد مواصفات مطابقة حالياً.";
            }
        } catch (error) {
            console.error("Error:", error);
            const botResponseDiv = document.getElementById("botResponse");
            botResponseDiv.innerText = "عذراً، فشل الاتصال بالبوت الذكي. يرجى المحاولة لاحقاً.";
            botResponseDiv.style.color = "#ef4444";
        }
    }

    // تشغيل الإرسال عند الضغط على Enter
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>
</body>
</html>
