<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #2ea44f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.2);
        }
        h2 {
            text-align: center;
            color: #2ea44f;
            margin-top: 0;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            background-color: #0d1117;
            margin-bottom: 15px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .user-msg {
            background-color: #238636;
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            margin-left: auto;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2ea44f;
        }
        button {
            padding: 12px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea44f;
        }
        button:disabled {
            background-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏎️ مستشار وموسوعة السيارات الشامل</h2>
    
  <div class="chat-box" style="height: 460px; padding: 0; overflow: hidden; border-radius: 8px;">
    <iframe src="https://botpress.cloud" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<script>
    // استخدام مكتبة الويب الرسمية للاتصال الآمن بـ Botpress بدون أخطاء نطاق

   </div>
</body>
</html>
