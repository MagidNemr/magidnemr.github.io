<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #2ea44f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.2);
        }
        h2 {
            text-align: center;
            color: #2ea44f;
            margin-top: 0;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            background-color: #0d1117;
            margin-bottom: 15px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .user-msg {
            background-color: #238636;
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            margin-left: auto;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2ea44f;
        }
        button {
            padding: 12px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea44f;
        }
        button:disabled {
            background-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏎️ مستشار وموسوعة السيارات الشامل</h2>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">مرحباً بك! أنا مستشارك الذكي المتخصص في السيارات. اسألني عن مواصفات أي سيارة أو عطل وسأجيبك فوراً بدقة واختصار.</div>
    </div>
 <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا عن مواصفات السيارات..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>
  <!-- استبدال صندوق الكتابة ببوت شات Botpress -->
<div class="input-area" style="height: 500px; padding: 0; overflow: hidden; background: transparent;">
   <script>
    // المعرف الخاص بالبوت الخاص بك
    const BOT_ID = "20261023124213-5N6Q06MP"; 
    // رابط استدعاء المحادثات السريع والمباشر مع خوادم Botpress API
    const API_URL = `https://botpress.cloud{BOT_ID}/converse`;

    // إنشاء معرف عشوائي فريد لكل مستخدم للحفاظ على سياق المحادثة
    const CHAT_SESSION_ID = "user_" + Math.random().toString(36).substring(2, 15);

    async function sendMessage() {
        const userInput = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const messageText = userInput.value.trim();

        if (messageText === "") return;

        // 1. عرض رسالة المستخدم في الأعلى (مكان كلمة لانوس)
        // نقوم بمسح الرسائل السابقة وإضافة رسالة المستخدم الجديدة وتنسيقها بلون أخضر
        chatBox.innerHTML = `
            <div class="message" style="background-color: #10b981; color: white; padding: 10px; margin-bottom: 10px; border-radius: 5px;">
                ${messageText}
            </div>
            <div class="message u1-msg" id="botResponse" style="background-color: #262626; color: #a3a3a3; padding: 10px; border-radius: 5px;">
                جاري التفكير والرد...
            </div>
        `;

        // تفريغ حقل الكتابة بعد الإرسال
        userInput.value = "";

        try {
            // 2. إرسال السؤال إلى سيرفر Botpress الشغال عبر الـ API
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-user-id": CHAT_SESSION_ID
                },
                body: JSON.stringify({
                    text: messageText
                })
            });

            const data = await response.json();
            const botResponseDiv = document.getElementById("botResponse");

            // 3. استقبال الرد من البوت وعرضه مباشرة مكان جملة "حدث خطأ"
            if (data.responses && data.responses.length > 0) {
                // جلب النص الراجع من البوت
                botResponseDiv.innerText = data.responses[0].text;
                botResponseDiv.style.color = "#ffffff"; // تغيير اللون للأبيض ليصبح واضحاً
            } else {
                botResponseDiv.innerText = "لم يتمكن البوت من الرد على هذا السؤال.";
            }

        } catch (error) {
            console.error("Error:", error);
            const botResponseDiv = document.getElementById("botResponse");
            botResponseDiv.innerText = "عذراً، فشل الاتصال بالبوت الذكي. يرجى المحاولة لاحقاً.";
            botResponseDiv.style.color = "#ef4444"; // لون أحمر للإشارة إلى الخطأ
        }
    }

    // دالة لتشغيل الإرسال عند الضغط على زر Enter من لوحة المفاتيح
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
