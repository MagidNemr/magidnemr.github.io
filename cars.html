<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #2ea44f; /* إطار أخضر ممتد من هويتك */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.2);
        }
        h2 {
            text-align: center;
            color: #2ea44f; /* لون أخضر جذاب */
            margin-top: 0;
        }
        .chat-box {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            background-color: #0d1117;
            margin-bottom: 15px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #238636; /* لون الرسالة للمستخدم أخضر غامق */
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            margin-left: auto;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2ea44f;
        }
        button {
            padding: 12px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea44f;
        }
        button:disabled {
            background-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏎️ مستشار وموسوعة السيارات الشامل</h2>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">مرحباً بك! أنا مستشارك الذكي المتخصص في السيارات، قوانين المرور والمواصفات الفنية. كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اسأل عن أي سيارة، عطل، أو تفاصيل مرور..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // ⚠️ ضَع مفتاح الـ API الفعلي الخاص بك هنا بين علامتي التنصيص
    const API_KEY = "AQ.Ab8RN6IX_5gXmSni23rTHS2hAS0X2-95x88d1knZkRZ0IymUKA"; 

    // رابط الـ API المحدث للنسخة المستقرة
    const API_URL = `https://googleapis.com{API_KEY}`;

    // التعليمات البرمجية لتوجيه الذكاء الاصطناعي (System Instructions)
    const SYSTEM_INSTRUCTION = "أنت مساعد ذكي خبير ومتخصص حصرياً وفقط في عالم السيارات، الأعطال الميكانيكية والكهربائية، الصيانات، المواصفات الفنية لجميع الموديلات، وقوانين وإجراءات المرور. وظيفتك هي تقديم إجابات دقيقة وسريعة ومختصرة للمستخدم باللغة العربية. إذا قام المستخدم بسؤالك عن أي شيء خارج نطاق السيارات والمرور، يجب عليك الاعتذار منه بلطف بعبارة: 'عذراً، أنا هنا لمساعدتك في كل ما يخص السيارات والمرور فقط!'.";

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatBox = document.getElementById("chatBox");
        const userText = inputField.value.trim();

        if (!userText) return;

        // إضافة رسالة المستخدم للشاشة
        appendMessage(userText, "user-msg");
        inputField.value = "";
        
        // تعطيل الإرسال مؤقتاً أثناء الرد
        sendBtn.disabled = true;
        
        // إضافة مؤشر الانتظار
        const loadingDiv = appendMessage("جاري كتابة الرد...", "ai-msg");

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [
                        { parts: [{ text: userText }] }
                    ],
                    systemInstruction: {
                        parts: [{ text: SYSTEM_INSTRUCTION }]
                    },
                    generationConfig: {
                        maxOutputTokens: 600,
                        temperature: 0.3
                    }
                })
            });

            const data = await response.json();
            
            // إزالة مؤشر الانتظار
            loadingDiv.remove();

            // فحص واستخراج النص بالطريقة الصحيحة لـ Gemini
            if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                let aiResponse = data.candidates[0].content.parts[0].text;
                appendMessage(aiResponse, "ai-msg");
            } else if (data.error) {
                appendMessage(`خطأ من الخادم: ${data.error.message}`, "ai-msg");
            } else {
                appendMessage("عذراً، لم أتمكن من معالجة الرد بالشكل الصحيح.", "ai-msg");
            }

        } catch (error) {
            console.error("Error:", error);
            if(loadingDiv) loadingDiv.remove();
            appendMessage("حدث خطأ في الاتصال، تأكد من صحة مفتاح الـ API والإنترنت.", "ai-msg");
        } finally {
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
