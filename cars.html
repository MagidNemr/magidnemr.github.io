<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الذكي</title>
    <style>
        :root {
            --bg-color: #0b1116; 
            --primary-color: #00ffcc; 
            --btn-color: #ff2a74; 
            --card-bg: rgba(17, 24, 39, 0.95);
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            direction: rtl;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .card p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .card input {
            width: 90%;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }

        .card input:focus {
            border-color: var(--primary-color);
        }

        .card button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            transition: transform 0.2s;
        }

        .card button:hover {
            transform: scale(1.03);
        }

        .chat-section {
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            overflow: hidden;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
        }

        .chat-header {
            background-color: #111c24;
            color: var(--primary-color);
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid var(--primary-color);
            text-align: right;
        }

        .chat-body {
            height: 350px;
            background-color: #0a0a0a;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- استعادة شبكة الكروت والتصميم الأصلي الفخم بالكامل -->
        <div class="cards-grid">
            <div class="card">
                <h3>🔧 المواصفات الفنية</h3>
                <p>استعلم عن مواصفات السيارة.</p>
                <input type="text" id="brandInput" placeholder="أدخل ماركة السيارة...">
                <button onclick="sendToBot('specs')">فحص المواصفات</button>
            </div>

            <div class="card">
                <h3>🚦 الاستعلام عن المخالفات</h3>
                <p>المخالفات المرورية الصادرة.</p>
                <input type="text" id="plateInput" placeholder="أدخل رقم اللوحة...">
                <button onclick="sendToBot('violations')">عرض المخالفات</button>
            </div>

            <div class="card">
                <h3>💳 حساب رسوم التراخيص</h3>
                <p>رسوم التراخيص وتجديد المركبات داخل مصر وفقاً للسعة والموديل.</p>
                <input type="text" id="ccInput" placeholder="أدخل السعة اللترية (مثال: 1600)...">
                <button onclick="sendToBot('fees')">حساب الرسوم</button>
            </div>
        </div>

        <!-- صندوق المستشار وبداخلة شات البوت المحدث تلقائياً -->
        <div class="chat-section">
            <div class="chat-header">
                🟢 مستشار السيارات والمخالفات المحدث تلقائياً
            </div>
            <div class="chat-body">
                <!-- دمج البوت الذكي ليعمل مباشرة وبثبات داخل صندوق التصميم -->
                <iframe id="botIframe" src="https://botpress.cloud"></iframe>
            </div>
        </div>

    </div>

    <script>
        // دالة الربط السحرية لإرسال الكلمات المكتوبة من خاناتك مباشرة لشات البوت المحدث
        function sendToBot(type) {
            let queryText = "";
            
            if (type === 'specs') {
                const brand = document.getElementById('brandInput').value.trim();
                if(!brand) return alert("من فضلك أدخل ماركة السيارة أولاً!");
                queryText = `مواصفات السياره ماركه ${brand}`;
            } else if (type === 'violations') {
                const plate = document.getElementById('plateInput').value.trim();
                if(!plate) return alert("من فضلك أدخل رقم اللوحة أولاً!");
                queryText = `استعلام عن مخالفات السياره رقم ${plate}`;
            } else if (type === 'fees') {
                const cc = document.getElementById('ccInput').value.trim();
                if(!cc) return alert("من فضلك أدخل السعة اللترية أولاً!");
                queryText = `حساب رسوم التراخيص لسيارة سعة ${cc} سي سي في مصر`;
            }
            
            // تحديث رابط الشات وتمرير السؤال له تلقائياً ليجيب فوراً بكل ذكاء
            const iframe = document.getElementById('botIframe');
            const baseUrl = "https://botpress.cloud";
            
            // إعادة تحميل الشات بالسؤال الجديد ليقوم بالرد المحدث فوراً
            iframe.src = baseUrl + "&query=" + encodeURIComponent(queryText);
        }
    </script>

</body>
</html>
