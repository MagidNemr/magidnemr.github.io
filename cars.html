<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار وموسوعة السيارات الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #2ea44f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(46, 164, 79, 0.2);
        }
        h2 {
            text-align: center;
            color: #2ea44f;
            margin-top: 0;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            background-color: #0d1117;
            margin-bottom: 15px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .user-msg {
            background-color: #238636;
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            margin-left: auto;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2ea44f;
        }
        button {
            padding: 12px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea44f;
        }
        button:disabled {
            background-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<!-- الواجهة المدمجة والفخمة لمستشار السيارات الشامل 2026 -->
<div class="main-dashboard-container" style="max-width: 600px; margin: 0 auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; text-align: right;">
    
    <!-- قسم الخدمات الذكية المدمجة -->
    <div class="services-grid" style="display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px;">
        
        <!-- الزر الأول الثابت: إدارة المرور ونظام المخالفات -->
        <a href="https://ppo.gov.eg" target="_blank" style="text-decoration: none; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 15px 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: transform 0.2s;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 24px;">🚔</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">إدارة المرور ونظام المخالفات</strong>
                    <span style="font-size: 12px; color: #94a3b8;">اضغط هنا للانتقال الفوري ومعرفة مخالفاتك رسمياً</span>
                </div>
            </div>
            <span style="font-size: 18px; color: #10b981;">←</span>
        </a>

        <!-- الزر الثاني المدمج: مستشار السيارات الشامل (مواصفات + حاسبة التراخيص) -->
        <div style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 20px; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                <span style="font-size: 24px;">🤖</span>
                <div>
                    <strong style="display: block; font-size: 16px; color: #10b981;">المستشار الذكي الشامل للسيارات</strong>
                    <span style="font-size: 12px; color: #94a3b8;">اسأله عن مواصفات أي سيارة أو اطلب منه حساب تكلفة التراخيص والرسوم مباشرة</span>
                </div>
            </div>

            <!-- مربع الشات الموحد والذكي المربوط ببوتك مباشرة -->
            <div style="width: 100%; height: 480px; border-radius: 8px; overflow: hidden; border: 1px solid #334155;">
                <iframe
                    src="https://botpress.cloud"
                    width="100%"
                    height="100%"
                    style="border: none;"
                    allow="microphone; geolocation; clipboard-write">
                </iframe>
            </div>
        </div>

    </div>
</div>

<script>
    // تم دمج الرابط الموحد بداخل الـ iframe بالأعلى ليعمل السيرفر بشكل مباشر وتلقائي للمهمتين معاً
</script>
</body>
</html>
