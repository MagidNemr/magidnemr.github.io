<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tech Aide | اللوحة الهندسية الشاملة</title>
    <script src="https://minepi.com"></script>
    <style>
        :root {
            --dark-bg: #0b0f19;
            --panel-bg: rgba(22, 30, 49, 0.85);
            --neon-blue: #00d2ff;
            --neon-green: #00f5d4;
            --neon-purple: #9d4edd;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #161b33 0%, var(--dark-bg) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.9), transparent);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }

        header p {
            margin: 10px 0 0;
            font-size: 14px;
            color: var(--neon-blue);
            font-weight: 600;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            padding: 0 15px;
        }

        .tab-btn {
            padding: 14px 28px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.03);
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover {
            color: #fff;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .tab-btn.active {
            color: var(--dark-bg);
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.5);
        }

        .container {
            max-width: 650px;
            margin: 0 auto 40px;
            padding: 0 15px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 13px;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }

        button {
            background: linear-gradient(135deg, var(--neon-purple), #7209b7);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.5);
        }

        button.btn-sec {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        button.btn-sec:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .result-box {
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-right: 5px solid var(--neon-blue);
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-box.sec-style {
            background: rgba(0, 245, 212, 0.05);
            border: 1px solid rgba(0, 245, 212, 0.2);
            border-right-color: var(--neon-green);
        }

        .result-box p {
            margin: 8px 0;
            font-size: 15px;
            line-height: 1.6;
        }

        .result-box strong {
            color: #ffffff;
        }

        .value-highlight {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--neon-green);
            font-size: 18px;
            text-shadow: 0 0 5px rgba(0, 245, 212, 0.5);
        }

        .footer {
            text-align: center;
            padding: 30px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1>SMART TECH AIDE ⚡</h1>
    <p>⚙️ المنصة الهندسية المتكاملة لكهرباء المصانع والمنشآت السكنية</p>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('residential')">🏠 المنظومة السكنية</button>
    <button class="tab-btn" onclick="switchTab('industrial')">🏭 المنظومة الصناعية والكنترول</button>
</div>

<div class="container">

    <!-- ================== قسم كهرباء المنازل ================== -->
    <div id="residential" class="tab-content active">
        <div class="card">
            <h2>⚡ حسابات وتوزيع الدوائر الفرعية</h2>
            <div class="form-group">
                <label for="resAppliance">تصنيف الحمل الكهربائي:</label>
                <select id="resAppliance" onchange="toggleResInput()">
                    <option value="lighting">💡 شبكة إنارة عادية</option>
                    <option value="sockets">🔌 برايز ومآخذ عامة</option>
                    <option value="ac">❄️ تكييف هواء</option>
                    <option value="heater">🔥 سخان مياه حراري</option>
                    <option value="custom">🛠️ حمل حر مخصص (وات)</option>
                </select>
            </div>
            <div class="form-group" id="customResWattGroup" style="display:none;">
                <label for="customResWatt">القدرة الاستيعابية بالوات (Watt):</label>
                <input type="number" id="customResWatt" placeholder="مثال: 3500">
            </div>
            <div class="form-group" id="acTonnageGroup" style="display:none;">
                <label for="acTonnage">القدرة الحصانية للتكييف:</label>
                <select id="acTonnage">
                    <option value="1.5">1.5 حصان</option>
                    <option value="2.25">2.25 حصان</option>
                    <option value="3">3 حصان</option>
                </select>
            </div>
            <button class="btn-sec" onclick="calculateResidential()">معالجة الحسابات السكنية</button>
            
            <div id="resResult" class="result-box sec-style">
                <p><strong>تيار سحب الدائرة المتوقع:</strong> <span id="resCurrent" class="value-highlight">0</span> أمبير</p>
                <p><strong>سعة القاطع المناسب (Breaker):</strong> <span id="resBreaker" class="value-highlight">0</span> أمبير</p>
                <p><strong>مقطع السلك النحاسي المعتمد:</strong> <span id="resCable" class="value-highlight">0</span> مم²</p>
                <p style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 8px;">ℹ️ <span id="resNote" style="color: var(--text-muted); font-size: 14px;">-</span></p>
            </div>
        </div>

        <div class="card">
            <h2>🔍 كاشف الأعطال الذكي للتمديدات والتأريض</h2>
            <div class="form-group">
                <label for="resFault">حدد نوع الخلل الملاحظ بالمنشأة:</label>
                <select id="resFault" onchange="diagnoseResFault()">
                    <option value="">-- افتح قائمة الأعطال السكنية --</option>
                    <option value="flicker">تذبذب شدة الإضاءة مع تشغيل أحمال حثية</option>
                    <option value="tripping">انهيار وتكرار فصل القاطع الرئيسي عشوائياً</option>
                    <option value="shock">وجود جهد تسريب وهزة كهربائية بهياكل الأجهزة المعدنية</option>
                </select>
            </div>
            <div id="resFaultResult" class="result-box sec-style">
                <p><strong>⚠️ التشخيص الهندسي:</strong> <span id="resReason" style="color: #ffb703;">-</span></p>
