<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tech Aide</title>
    <!-- استدعاء مكتبة Pi SDK الرسمية للتحقق والمدفوعات -->
    <script src="https://minepi.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #0b0b0f; color: #ffffff; padding: 20px; }
        .menu-container { max-width: 500px; margin: 30px auto; background: #13131a; padding: 25px; border-radius: 12px; border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        .btn-link { display: block; padding: 15px; margin: 12px 0; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .btn-link:hover { transform: scale(1.02); }
        #userStatus { color: #00ffcc; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="menu-container">
        <h2>تطبيق Smart Tech Aide</h2>
        <!-- مكان ظهور اسم المستخدم بعد التحقق من شبكة Pi -->
        <div id="userStatus">جاري الاتصال بشبكة Pi...</div>

        <!-- الأزرار الحسابية المرتبطة بملفات مستودعك القديمة بأمان وبدون أي تعديل -->
        <a href="conduit.html" class="btn-link" style="background: #222; color: #ffcc00; border: 1px solid #ffcc00;">📐 حاسبة أقطار مواسير التمديد</a>
        <a href="factor.html" class="btn-link" style="background: #222; color: #00ffcc; border: 1px solid #00ffcc;">⚡ حاسبة الأحمال وقواطع 3 فاز</a>
        
        <!-- التعديل المظبوط: ربط زر المكتبة بالملف المستقل والجديد الذي أنشأته سابقاً -->
        <a href="search-library.html" class="btn-link" style="background: #222; color: #ff9900; border: 1px solid #ff9900;">📚 المكتبة الفنية للكتب والكورسات</a>
        
        <!-- زر التوجيه المباشر لمدونتك للربح المزدوج -->
        <a href="https://blogspot.com" target="_blank" class="btn-link" style="background: #00a3a3; color: white;">🌐 مدونة النمر للمعلومات</a>
    </div>

    <script>
        // كود تشغيل التحقق الرسمي المربوط بمتصفح Pi Browser
        window.onload = function() {
            if (window.Pi) {
                Pi.init({ version: "2.0", sandbox: true });
                Pi.authenticate(["username"], function(auth) {
                    document.getElementById("userStatus").innerText = "مرحباً يا بشمهندس: " + auth.user.username;
                }, function(error) {
                    document.getElementById("userStatus").innerText = "يرجى فتح التطبيق من داخل متصفح Pi Browser";
                });
            }
        };
    </script>
</body>
</html>
