<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tech Aide | اللوحة الهندسية</title>
    <!-- استدعاء سكريبت Pi SDK الرسمي للمطورين -->
    <script src="https://minepi.com"></script>
    <style>
        /* التنسيقات والأنماط البصرية للوحة الهندسية */
        :root {
            --dark-bg: #090d16;
            --panel-bg: rgba(17, 24, 39, 0.95);
            --neon-blue: #00d2ff;
            --neon-green: #00f5d4;
            --neon-purple: #9d4edd;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark-bg); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; }
        header { text-align: center; padding: 30px 20px; border-bottom: 1px solid rgba(0, 210, 255, 0.2); }
        .container { max-width: 600px; margin: 20px auto 40px; padding: 0 15px; }
        .card { background: var(--panel-bg); border-radius: 16px; padding: 22px; margin-bottom: 25px; border: 1px solid rgba(0, 210, 255, 0.15); }
        button, .download-btn { background: linear-gradient(135deg, #6200ee, #7209b7); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: rgba(9, 13, 22, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #ffffff; margin-bottom: 15px; }
        .result-box { display: none; margin-top: 15px; padding: 15px; background: rgba(0, 210, 255, 0.05); border-radius: 8px; }
        .value-highlight { font-family: monospace; color: var(--neon-green); font-weight: bold; }
        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <h1>SMART TECH AIDE ⚡</h1>
        <p>المنصة البرمجية المعتمدة لهندسة القوى والتحكم الآلي</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>🏭 حاسبة أحمال المحركات ولوحات الباور (3 فاز)</h2>
            <input type="number" id="motorPower" placeholder="أدخل القدرة هنا...">
            <select id="powerUnit">
                <option value="HP">حصان (HP)</option>
                <option value="kW">كيلوواط (kW)</option>
            </select>
            <button onclick="calculateMotorLoads()">تحليل المكونات الصناعية</button>
            <div class="result-box" id="calcResults">
                <p>تيار الحمل الكامل (FLA): <span id="flaValue" class="value-highlight">0</span> أمبير</p>
            </div>
        </div>
        <div class="card">
            <h2>📚 دليل مهندسي القوى والصناعة</h2>
            <button class="download-btn" onclick="payAndDownload('#', 'كتاب التحكم الآلي')">تحميل PDF (0.1 Pi)</button>
        </div>
    </div>
    <footer>جميع الحقوق محفوظة © المهندس المطور ماجد نمر 2026</footer>
    <script>
        Pi.init({ version: "2.0", sandbox: true });
        function payAndDownload(pdfUrl, bookName) {
            Pi.createPayment({ amount: 0.1, memo: "شراء: " + bookName }, {
                onReadyForServerCompletion: function(paymentId, txid) {
                    alert("تم الدفع بنجاح! رقم التحويل: " + txid);
                    window.open(pdfUrl, "_blank");
                },
                onCancel: function() { alert("تم إلغاء الدفع."); },
                onError: function(err) { alert("حدث خطأ: " + err.message); }
            });
        }
        function calculateMotorLoads() {
            let power = parseFloat(document.getElementById('motorPower').value);
            if (isNaN(power) || power <= 0) return alert("أدخل قيمة صحيحة.");
            let fla = power * 1.5; // قيمة تقديرية توضيحية
            document.getElementById('flaValue').innerText = fla.toFixed(2);
            document.getElementById('calcResults').style.display = 'block';
        }
    </script>
</body>
</html>
