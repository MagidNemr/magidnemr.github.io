<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tech Aide</title>
    <!-- استدعاء مكتبة Pi SDK الرسمية للتوثيق -->
    <script src="https://minepi.com"></script>
    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .main-container {
            max-width: 550px;
            margin: 0 auto;
            background: #121216;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .app-title {
            text-align: center;
            color: #ffcc00;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .app-subtitle {
            text-align: center;
            color: #00ffcc;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .section-box {
            background: #181822;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .section-title {
            color: #ff9900;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #222230;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus { border-color: #00ffcc; }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #b300b3, #e600e6);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(230, 0, 230, 0.4);
        }
        .pdf-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }
        .pdf-btn {
            background: #00cc66;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        .result-box {
            margin-top: 15px;
            padding: 12px;
            background: #1c1c28;
            border-right: 4px solid #ffcc00;
            border-radius: 4px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="app-title">⚡ SMART TECH AIDE</div>
    <div class="app-subtitle">« المنصة البرمجية المعتمدة لهندسة القوى والتحكم الآلي »</div>
    <div id="userStatus" style="text-align:center; color:#00ffcc; font-size:12px; margin-bottom:15px;">جاري الاتصال بشبكة Pi...</div>

    <!-- 1. قسم حاسبة الأحمال المظبوط والثابت كودك الأصلي -->
    <div class="section-box">
        <div class="section-title">📂 حاسبة أحمال المحركات لوحات الباور (3 فاز)</div>
        <label>قدرة المحرك الميكانيكية بالموقع:</label>
        <input type="number" id="motorPower" placeholder="أدخل القيمة الرقمية...">
        
        <label>وحدة القدرة:</label>
        <select id="powerUnit">
            <option value="HP">حصان (HP)</option>
            <option value="kW">كيلو واط (kW)</option>
        </select>
        <button class="action-btn" onclick="analyzeMotor()">تحليل المكونات الصناعية للعمومية</button>
        <div id="calcResult"></div>
    </div>

    <!-- 2. قسم دليل مهندسي القوى كودك الأصلي -->
    <div class="section-box">
        <div class="section-title">📚 دليل مهندسي القوى والصناعة</div>
        <div class="pdf-row">
            <div>كتاب التحكم الآلي الكلاسيكي<br><span style="font-size:11px; color:#888;">(Classic Control) وصيانة وتشغيل اللوحات</span></div>
            <a href="https://blogspot.com" target="_blank" class="pdf-btn">تحميل PDF</a>
        </div>
        <div class="pdf-row" style="border-bottom: none;">
            <div>دليل الكود المصري للتركيبات الكهربائية</div>
            <a href="https://blogspot.com" target="_blank" class="pdf-btn">تحميل PDF</a>
        </div>
    </div>
</div>

<script>
    // تهيئة وتوثيق شبكة Pi المبدئي لضمان عدم توقف البرنامج داخل Pi Browser
    try {
        Pi.init({ version: "2.0", sandbox: true });
        document.getElementById("userStatus").innerText = "⚡ متصل بشبكة Pi Network بنجاح";
    } catch (e) {
        console.log("Pi SDK status:", e);
        document.getElementById("userStatus").innerText = "وضع المعاينة المحلي المحمي";
    }

    // دالة تحليل أحمال المحرك الهندسية 3 فاز
    function analyzeMotor() {
        const powerInput = parseFloat(document.getElementById("motorPower").value);
        const unit = document.getElementById("powerUnit").value;
        const resultDiv = document.getElementById("calcResult");

        if (isNaN(powerInput) || powerInput <= 0) {
            resultDiv.innerHTML = "<p style='color:#ff3333;'>برجاء إدخال قيمة رقمية صحيحة أكبر من الصفر.</p>";
            return;
        }

        // تحويل القدرة إلى كيلو واط ثابت للحساب
        let powerKW = powerInput;
        if (unit === "HP") {
            powerKW = powerInput * 0.746; // 1 حصان = 0.746 كيلو واط
        }

        // قانون حساب التيار لـ 3 فاز (الجهد الافتراضي المعتمد 380 فولت، معامل القدرة 0.85، الكفاءة 0.85)
        // الفولتية الافتراضية للشبكات الصناعية بمصر والشرق الأوسط 380V
        const voltage = 380;
        const pf = 0.85;
        const efficiency = 0.85;
        
        // حساب شدة تيار الحمل الكامل (FLA) بالـ أمبير
        const current = (powerKW * 1000) / (Math.sqrt(3) * voltage * pf * efficiency);
        
        // حساب سعة القاطع الموصى به (تأمين بدء المحرك حماية مغناطيسية وحرارية 125% إلى 150%)
        const breakerSize = current * 1.25;
        
        // مقطع السلك النحاسي التقريبي المعتمد (أمان 4 أمبير لكل 1 مم مربع داخل اللوحات)
        const wireSize = current / 4;

        // طباعة النتائج بتنسيق منظم داخل واجهتك
        resultDiv.innerHTML = `
            <div class="result-box">
                <strong style="color: #00ffcc;">📊 النتائج التقديرية للحمل (3-Phase):</strong><br>
                ⚡ تيار الحمل الكامل (FLA): <span style="color:#ffcc00;">${current.toFixed(2)} أمبير</span><br>
                🔌 سعة القاطع المقترحة (Breaker): <span style="color:#ffcc00;">${breakerSize.toFixed(1)} أمبير</span><br>
                📐 مقطع الكابل النحاسي الأدنى: <span style="color:#ffcc00;">${wireSize.toFixed(1)} مم²</span>
            </div>
        `;
    }
</script>

</body>
    </html>
